<div id="root"></div>
<script>
// ── ALIAS ────────────────────────────────────────────────────────────────────
const h=React.createElement;
const {useState,useEffect,useRef,Fragment}=React;

// ── UTILIDADES ───────────────────────────────────────────────────────────────
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const CY=new Date().getFullYear();
const CM=new Date().getMonth();
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MC=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DS=['L','M','X','J','V','S','D'];
const yOf=s=>parseInt(s.slice(0,4),10);
const mOf=s=>parseInt(s.slice(5,7),10)-1;
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const fmtL=s=>{const d=new Date(s+'T12:00:00');return d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear();};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isWE=d=>{const w=d.getDay();return w===0||w===6;};
const d2s=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sameD=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const monOf=d=>{const r=new Date(d);const w=r.getDay();r.setDate(r.getDate()+(w===0?-6:1-w));r.setHours(0,0,0,0);return r;};
const ll=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const ls=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const ME=[5,11];

function wkDays(iso){
  const n=new Date();n.setHours(0,0,0,0);
  const t=new Date(iso+'T12:00:00');
  const df=Math.ceil((t-n)/86400000);
  if(df<=0)return null;
  return{weeks:Math.floor(df/7),days:df%7,total:df};
}
function nxtCobro(dia){
  const n=new Date();n.setHours(0,0,0,0);
  let y=n.getFullYear(),m=n.getMonth();
  let c=new Date(y,m,dia);
  if(c<=n){m++;if(m>11){m=0;y++;}c=new Date(y,m,dia);}
  const df=Math.ceil((c-n)/86400000);
  return{date:c,weeks:Math.floor(df/7),days:df%7,total:df};
}
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,
    mo2=Math.floor((a+11*hh+22*l)/451),
    mo=Math.floor((hh+l-7*mo2+114)/31),
    dy=((hh+l-7*mo2+114)%31)+1;
  return new Date(y,mo-1,dy);
}
function festivos(year,com){
  const e=easter(year);
  const vs=new Date(e);vs.setDate(e.getDate()-2);
  const lp=new Date(e);lp.setDate(e.getDate()+1);
  const js=new Date(e);js.setDate(e.getDate()-3);
  const cL=['cataluna','c-valenciana','baleares','navarra','pais-vasco','la-rioja','murcia'];
  const f=[
    {d:new Date(year,0,1),n:'Año Nuevo'},{d:new Date(year,0,6),n:'Reyes Magos'},
    {d:vs,n:'Viernes Santo'},{d:new Date(year,4,1),n:'Día del Trabajo'},
    {d:new Date(year,9,12),n:'Fiesta Nacional'},{d:new Date(year,10,1),n:'Todos los Santos'},
    {d:new Date(year,11,6),n:'Día de la Constitución'},{d:new Date(year,11,8),n:'Inmaculada Concepción'},
    {d:new Date(year,11,25),n:'Navidad'},
  ];
  if(cL.includes(com))f.push({d:lp,n:'Lunes de Pascua'});else f.push({d:js,n:'Jueves Santo'});
  if(com==='cataluna'){f.push({d:new Date(year,5,24),n:'Sant Joan'});f.push({d:new Date(year,8,11),n:'La Diada'});f.push({d:new Date(year,11,26),n:'Sant Esteve'});}
  return f.sort((a,b)=>a.d-b.d);
}
const isFest=(d,fs)=>fs.some(f=>sameD(f.d,d));
function calcFin(ini,dias,tipo,fs){
  const c=new Date(ini+'T12:00:00');let ct=0,fu=0;
  while(true){
    const iF=isFest(c,fs),iW=isWE(c);
    if(tipo==='laborables'){if(!iF&&!iW)ct++;else if(iF)fu++;}
    else{if(!iF)ct++;else fu++;}
    if(ct>=dias)break;
    c.setDate(c.getDate()+1);
  }
  return{fin:d2s(c),fu};
}
function dUsados(e,tipo,com,hoy){
  const dias=Number(e.dias||0);if(!dias)return 0;
  const ini=new Date(e.fecha+'T12:00:00');if(ini>hoy)return 0;
  const fs=festivos(yOf(e.fecha),com);
  const c=new Date(ini);let ct=0,u=0;
  while(c<=hoy&&ct<dias){
    const iF=isFest(c,fs),iW=isWE(c);
    if(tipo==='laborables'){if(!iF&&!iW){ct++;u++;}}
    else{if(!iF){ct++;u++;}}
    c.setDate(c.getDate()+1);
  }
  return u;
}
function cTurno(mon,list,frec,ancla,idx){
  if(!list||!list.length||!ancla)return null;
  const am=monOf(new Date(ancla+'T12:00:00'));
  const dif=Math.round((monOf(mon)-am)/(7*86400000));
  const bl=Math.floor(dif/frec);
  return list[((idx+bl)%list.length+list.length)%list.length];
}
function generarInforme(year){
  const fals=(ll('fallos')||[]).filter(i=>yOf(i.fecha)===year);
  const hrs=(ll('horas')||[]).filter(i=>yOf(i.fecha)===year);
  const vac=(ll('vac-e')||[]).filter(i=>yOf(i.fecha)===year);
  const vacT=ll('vac-t')||{};
  const inc=(ll('incid')||[]).filter(i=>yOf(i.fecha)===year);
  const aus=(ll('ausencias')||[]).filter(i=>yOf(i.fecha)===year);
  const nom=(ll('nominas')||[]).filter(n=>n.year===year);
  const tipo=ll('vac-tipo')||'laborables';const com=ll('vac-comunidad')||'cataluna';
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const totalD=Number(vacT[String(year)]??0);
  const usVac=vac.reduce((a,e)=>a+dUsados(e,tipo,com,hoy),0);
  const totHrs=hrs.reduce((s,i)=>s+Number(i.horas||0),0);
  const totNom=nom.reduce((s,n)=>s+Number(n.importe||0)+(ME.includes(n.mes)?Number(n.extra||0):0),0);
  const fD=s=>new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const tbl=(titulo,rows)=>rows.length===0?'':(`<h2>${titulo}</h2><table><thead><tr>${Object.keys(rows[0]).map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Object.values(r).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
  const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><title>Labora ${year}</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:32px;color:#1e293b;font-size:13px}h1{font-size:24px;margin-bottom:4px}.sub{color:#94a3b8;margin-bottom:32px}h2{font-size:15px;font-weight:700;border-bottom:2px solid #e2e8f0;padding-bottom:6px;margin-top:28px}table{width:100%;border-collapse:collapse;margin-bottom:8px}th{background:#f8fafc;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;color:#64748b;font-weight:600;border-bottom:1px solid #e2e8f0}td{padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#475569}.res{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;min-width:120px}.cl{font-size:10px;text-transform:uppercase;color:#94a3b8;font-weight:600}.cv{font-size:22px;font-weight:800;color:#1e293b;margin-top:2px}.cu{font-size:11px;color:#94a3b8}footer{margin-top:40px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center}@media print{body{padding:16px}}</style></head><body><h1>💼 Labora — Informe ${year}</h1><div class="sub">Generado el ${new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'})}</div><h2>Resumen</h2><div class="res"><div class="card"><div class="cl">Vacaciones usadas</div><div class="cv">${usVac}</div><div class="cu">de ${totalD} días</div></div><div class="card"><div class="cl">Horas extra</div><div class="cv">${totHrs}</div><div class="cu">horas total</div></div><div class="card"><div class="cl">Fallos</div><div class="cv">${fals.length}</div><div class="cu">registrados</div></div><div class="card"><div class="cl">Ausencias</div><div class="cv">${aus.length}</div><div class="cu">registradas</div></div>${nom.length>0?`<div class="card"><div class="cl">Total nóminas</div><div class="cv">${totNom.toLocaleString('es-ES')}€</div><div class="cu">${nom.length} meses</div></div>`:''}</div>${tbl('🌴 Vacaciones',[...vac].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(e=>({'Inicio':fD(e.fecha),'Fin':e.fin?fD(e.fin):'-','Días':e.dias,'Nota':e.desc||'-'})))}${tbl('💵 Nóminas',[...nom].sort((a,b)=>a.mes-b.mes).map(n=>({'Mes':MESES[n.mes],'Nómina':Number(n.importe).toLocaleString('es-ES')+'€','Extra':ME.includes(n.mes)&&n.extra>0?Number(n.extra).toLocaleString('es-ES')+'€':'-','Total':(Number(n.importe)+(ME.includes(n.mes)?Number(n.extra||0):0)).toLocaleString('es-ES')+'€','Notas':n.notas||'-'})))}${tbl('⏱️ Horas extra',[...hrs].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(hh=>({'Fecha':fD(hh.fecha),'Horas':hh.horas,'Nota':hh.desc||'-'})))}${tbl('🚫 Ausencias',[...aus].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(a=>({'Fecha':fD(a.fecha),'Tipo':a.just,'Motivo':a.motivo||'-','Horas':a.horas>0?a.horas+'h':'Día completo','Estado':a.estado})))}${tbl('⚠️ Fallos',[...fals].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(f=>({'Fecha':fD(f.fecha),'Descripción':f.desc})))}${tbl('⚠️ Incidencias',[...inc].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(i=>({'Fecha':fD(i.fecha),'Título':i.titulo,'Descripción':i.desc})))}<footer>Generado con Labora</footer></body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w)w.onload=()=>setTimeout(()=>w.print(),500);
  setTimeout(()=>URL.revokeObjectURL(url),15000);
}

// ── COLORES ──────────────────────────────────────────────────────────────────
const A={red:'#dc2626',redL:'#fee2e2',blue:'#2563eb',blueL:'#dbeafe',
  em:'#059669',emL:'#d1fae5',amb:'#d97706',ambL:'#fef3c7',
  pur:'#7c3aed',purL:'#ede9fe',teal:'#0d9488',tealL:'#ccfbf1'};
const TC={'Mañana':{bg:'#fef3c7',c:'#92400e',b:'#fcd34d'},'Tarde':{bg:'#dbeafe',c:'#1e3a8a',b:'#93c5fd'},'Noche':{bg:'#ede9fe',c:'#4c1d95',b:'#c4b5fd'}};
const tc=t=>TC[t]||{bg:'#f0fdf4',c:'#065f46',b:'#6ee7b7'};

// ── ICONOS ───────────────────────────────────────────────────────────────────
const IcoEdit=()=>h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
  h('path',{d:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'}),
  h('path',{d:'M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z'}));
const IcoTrash=()=>h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
  h('polyline',{points:'3 6 5 6 21 6'}),
  h('path',{d:'M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'}),
  h('path',{d:'M10 11v6M14 11v6'}),
  h('path',{d:'M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2'}));
const IcoX=({s=18})=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.5,strokeLinecap:'round'},
  h('line',{x1:18,y1:6,x2:6,y2:18}),h('line',{x1:6,y1:6,x2:18,y2:18}));
const IcoChk=()=>h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'},
  h('polyline',{points:'20 6 9 17 4 12'}));

// ── COMPONENTES BASE ─────────────────────────────────────────────────────────
const Stat=({label,value,unit,color})=>h('div',{style:{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:'10px 12px',flex:1,minWidth:0}},
  h('div',{style:{fontSize:10,textTransform:'uppercase',color:'#94a3b8',fontWeight:600}},label),
  h('div',{style:{fontSize:26,fontWeight:800,color,marginTop:2,lineHeight:1}},value),
  h('div',{style:{fontSize:11,color:'#94a3b8',marginTop:2}},unit));

const SHead=({emoji,title,sub,bg})=>h('div',{style:{display:'flex',alignItems:'center',gap:10}},
  h('div',{style:{width:40,height:40,borderRadius:12,background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}},emoji),
  h('div',null,
    h('div',{style:{fontWeight:800,fontSize:16,color:'#1e293b'}},title),
    h('div',{style:{fontSize:11,color:'#94a3b8'}},sub)));

const AddBtn=({label,color,onClick})=>h('button',{onClick,style:{width:'100%',background:color,color:'white',border:'none',borderRadius:12,padding:'13px 0',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontWeight:600,fontSize:15,cursor:'pointer'}},
  h('span',{style:{fontSize:20,lineHeight:1}},'+'),label);

const Empty=({text})=>h('div',{style:{background:'white',borderRadius:12,border:'2px dashed #cbd5e1',padding:32,textAlign:'center',color:'#94a3b8',fontSize:14}},text);

function Item({item,onEdit,onDelete,children}){
  const [conf,setConf]=useState(false);
  return h('div',{style:{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:12,display:'flex',gap:8}},
    h('div',{style:{flex:1,minWidth:0}},children),
    h('div',{style:{display:'flex',flexDirection:'column',gap:4,flexShrink:0}},
      !conf
        ? [h('button',{key:'e',onClick:()=>onEdit(item),style:{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}},h(IcoEdit)),
           h('button',{key:'d',onClick:()=>setConf(true),style:{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}},h(IcoTrash))]
        : [h('button',{key:'ok',onClick:()=>{onDelete(item.id);setConf(false);},style:{padding:'6px 8px',background:'#dc2626',border:'none',borderRadius:8,cursor:'pointer',color:'white',fontWeight:800,fontSize:11}},'OK'),
           h('button',{key:'x',onClick:()=>setConf(false),style:{padding:6,background:'#f1f5f9',border:'none',borderRadius:8,cursor:'pointer',color:'#64748b'}},h(IcoX,{s:14}))]));
}

function FiltroMes({year,items,mes,onMes,color}){
  const ref=useRef(null);
  const con=new Set(items.filter(i=>yOf(i.fecha)===year).map(i=>mOf(i.fecha)));
  useEffect(()=>{if(ref.current&&mes!==null){const b=ref.current.querySelector(`[data-m="${mes}"]`);if(b)b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}},[mes]);
  return h('div',{ref,className:'ms',style:{display:'flex',gap:6,overflowX:'auto',paddingBottom:4}},
    h('button',{onClick:()=>onMes(null),style:{flexShrink:0,padding:'6px 14px',borderRadius:20,border:'1px solid '+(mes===null?color:'#e2e8f0'),background:mes===null?color:'white',color:mes===null?'white':'#64748b',fontWeight:600,fontSize:12,cursor:'pointer'}},'Todos'),
    ...MC.map((m,i)=>{const a=mes===i,t=con.has(i);return h('button',{key:i,'data-m':i,onClick:()=>onMes(a?null:i),style:{flexShrink:0,padding:'6px 12px',borderRadius:20,border:'1px solid '+(a?color:t?'#e2e8f0':'#f1f5f9'),background:a?color:'white',color:a?'white':t?'#475569':'#cbd5e1',fontWeight:a||t?600:400,fontSize:12,cursor:'pointer',opacity:t||a?1:0.5}},m);}));
}

function Form({title,fields,initial,onSave,onCancel,color}){
  const [d,setD]=useState({...initial});
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const sub=()=>{for(const f of fields)if(f.req&&!String(d[f.name]||'').trim()){alert('Completa: '+f.label);return;}onSave(d);};
  return h('div',{style:{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}},
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
      h('span',{style:{fontWeight:700,color:'#1e293b'}},title),
      h('button',{onClick:onCancel,style:{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}},h(IcoX))),
    ...fields.map(f=>h('div',{key:f.name},
      h('label',{style:{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}},f.label,f.req&&h('span',{style:{color:'#ef4444'}},' *')),
      f.type==='textarea'
        ? h('textarea',{rows:3,value:d[f.name]||'',onChange:e=>setD({...d,[f.name]:e.target.value}),placeholder:f.ph||'',style:{...inp,resize:'none'}})
        : h('input',{type:f.type||'text',step:f.step,min:f.min,value:d[f.name]||'',onChange:e=>setD({...d,[f.name]:e.target.value}),placeholder:f.ph||'',style:inp}))),
    h('div',{style:{display:'flex',gap:8}},
      h('button',{onClick:onCancel,style:{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}},'Cancelar'),
      h('button',{onClick:sub,style:{flex:1,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}},'Guardar')));
}

// ── FOTOS ────────────────────────────────────────────────────────────────────
const FotoV=({src,onClose})=>h('div',{onClick:onClose,style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}},
  h('img',{src,style:{maxWidth:'100%',maxHeight:'90vh',borderRadius:8,objectFit:'contain'}}),
  h('button',{onClick:onClose,style:{position:'absolute',top:16,right:16,background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:36,height:36,color:'white',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},'x'));

function FotosPicker({fotos,onChange}){
  const [v,setV]=useState(null);
  const add=e=>{const fs=Array.from(e.target.files).slice(0,3-fotos.length);fs.forEach(f=>{const r=new FileReader();r.onload=ev=>onChange([...fotos,ev.target.result]);r.readAsDataURL(f);});e.target.value='';};
  return h('div',null,
    v&&h(FotoV,{src:v,onClose:()=>setV(null)}),
    h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}},
      ...fotos.map((f,i)=>h('div',{key:i,style:{position:'relative'}},

      h(Card,{emoji:'💰',top:'Días para cobrar',val:cobroData.total,valColor:A.pur,sub:'día '+cobro+' de cada mes',onClick:()=>onNav('cobro')}),
      h(Card,{emoji:'⏱️',top:'Horas extra',val:sumHrs,valColor:A.blue,sub:'año '+CY,onClick:()=>onNav('horas')}),
      h(Card,{emoji:'🔄',top:'Turno esta semana',val:tAct||'—',valColor:tAct?tc(tAct).c:'#cbd5e1',sub:tSig&&tSig!==tAct?'→ '+tSig+' próx.':tAct?'rotación activa':'Sin configurar',subColor:tSig&&tSig!==tAct?A.amb:undefined,onClick:()=>onNav('turnos')})),
    h('div',{style:{display:'flex',gap:8}},
      h('div',{onClick:()=>onNav('nominas'),style:{flex:1,background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:'10px 12px',cursor:'pointer'}},
        h('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:3}},'💵 Última nómina'),
        ultimaNom
          ? h(Fragment,null,h('div',{style:{fontSize:20,fontWeight:800,color:A.teal}},Number(ultimaNom.importe).toLocaleString('es-ES')+'€'),h('div',{style:{fontSize:11,color:'#94a3b8',marginTop:2}},MESES[ultimaNom.mes]+' '+CY))
          : h('div',{style:{fontSize:13,color:'#cbd5e1',marginTop:4}},'Sin registrar')),
      h('div',{onClick:()=>onNav('fallos'),style:{flex:1,background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:'10px 12px',cursor:'pointer'}},
        h('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:3}},'⚠️ Fallos este mes'),
        h('div',{style:{fontSize:20,fontWeight:800,color:yeFallos.length>0?A.red:'#1e293b'}},yeFallos.length),
        h('div',{style:{fontSize:11,color:'#94a3b8',marginTop:2}},MESES[CM]+' '+CY))));
}

// ── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App(){
  const [ok,setOk]=useState(()=>!!ll('disclaimer-ok'));
  const [tab,setTab]=useState('inicio');
  const [year,setYear]=useState(CY);
  const [vacE,setVacE]=useState(()=>ll('vac-e')||[]);
  const [vacT,setVacT]=useState(()=>ll('vac-t')||{});
  const [fallos,setFallos]=useState(()=>ll('fallos')||[]);
  const [horas,setHoras]=useState(()=>ll('horas')||[]);
  const [incid,setIncid]=useState(()=>ll('incid')||[]);
  const [ausencias,setAusencias]=useState(()=>ll('ausencias')||[]);
  const [turnos,setTurnos]=useState(()=>ll('turnos')||{});
  const [nominas,setNominas]=useState(()=>ll('nominas')||[]);
  const [cobro,setCobro]=useState(()=>parseInt(ll('cobro-dia')||'28'));

  const sv=(k,set)=>v=>{set(v);ls(k,v);};

  useEffect(()=>{const c=parseInt(ll('cobro-dia')||'28');setCobro(c);},[tab]);

  if(!ok)return h(DisclaimerModal,{onAcepto:()=>{ls('disclaimer-ok',true);setOk(true);}});

  const TABS=[{id:'inicio',label:'Inicio',emoji:'🏠'},{id:'vac',label:'Vac.',emoji:'🌴'},{id:'horas',label:'Horas',emoji:'⏱️'},{id:'nominas',label:'Nómina',emoji:'💵'},{id:'mas',label:'Más',emoji:'⚙️'}];
  const MAS_TABS=[{id:'cobro',label:'Cobro',emoji:'💰'},{id:'turnos',label:'Turnos',emoji:'🔄'},{id:'fallos',label:'Fallos',emoji:'⚠️'},{id:'ausencias',label:'Ausencias',emoji:'🚫'},{id:'backup',label:'Backup',emoji:'💾'}];
  const isMas=MAS_TABS.some(t=>t.id===tab);
  const navTab=isMas?'mas':tab;
  const needsYear=['vac','horas','fallos','ausencias'].includes(tab);

  const renderContent=()=>{
    if(tab==='inicio')return h(InicioSection,{vacE,vacTotales:vacT,fallos,horas,ausencias,nominas,turnos,cobro,onNav:t=>setTab(t)});
    if(tab==='vac')return h(VacSection,{entries:vacE,totales:vacT,year,onUpdateE:sv('vac-e',setVacE),onUpdateT:sv('vac-t',setVacT)});
    if(tab==='horas')return h(HorasSection,{items:horas,year,onUpdate:sv('horas',setHoras)});
    if(tab==='nominas')return h(NominaSection,{nominas,onUpdate:sv('nominas',setNominas)});
    if(tab==='cobro')return h(CobroSection);
    if(tab==='turnos')return h(TurnosSection,{turnos,onUpdate:sv('turnos',setTurnos)});
    if(tab==='fallos')return h(FallosSection,{fallos,incid,year,onUpdateF:sv('fallos',setFallos),onUpdateI:sv('incid',setIncid)});
    if(tab==='ausencias')return h(AusenciasSection,{items:ausencias,year,onUpdate:sv('ausencias',setAusencias)});
    if(tab==='backup')return h(BackupSection);
    if(tab==='mas')return h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
      h('div',{style:{fontSize:13,fontWeight:600,color:'#64748b',marginBottom:4}},'Más opciones'),
      ...MAS_TABS.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),style:{display:'flex',alignItems:'center',gap:12,background:'white',border:'1px solid #e2e8f0',borderRadius:12,padding:'14px 16px',cursor:'pointer',textAlign:'left',width:'100%'}},
        h('span',{style:{fontSize:22}},t.emoji),h('span',{style:{fontSize:15,fontWeight:600,color:'#1e293b'}},t.label),h('span',{style:{marginLeft:'auto',color:'#cbd5e1',fontSize:18}},'›'))));
    return null;
  };

  return h('div',{style:{maxWidth:500,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column',background:'#f8fafc'}},
    h('div',{style:{background:'#1e293b',padding:'14px 16px 12px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}},
      h('div',null,
        h('div',{style:{fontSize:18,fontWeight:800,color:'white',letterSpacing:-0.5}},'💼 Labora'),
        h('div',{style:{fontSize:11,color:'#94a3b8',marginTop:1}},tab==='inicio'?'Tu resumen laboral':TABS.find(t=>t.id===navTab)?.label||MAS_TABS.find(t=>t.id===tab)?.label||'')),
      h('div',{style:{display:'flex',alignItems:'center',gap:10}},
        needsYear&&h('select',{value:year,onChange:e=>setYear(Number(e.target.value)),style:{appearance:'none',background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.2)',borderRadius:8,padding:'5px 10px',color:'white',fontSize:13,fontWeight:600,cursor:'pointer'}},
          ...[CY+1,CY,CY-1,CY-2].map(y=>h('option',{key:y,value:y,style:{background:'#1e293b'}},y))),
        h(DisclaimerInfo))),
    h('div',{className:'ms',style:{flex:1,overflowY:'auto',padding:16}},renderContent()),
    h('div',{style:{borderTop:'1px solid #e2e8f0',background:'white',textAlign:'center',padding:'5px 0 4px'}},
      h('span',{style:{fontSize:11,color:'#94a3b8'}},'☕ ¿Te es útil? '),
      h('a',{href:'https://ko-fi.com',target:'_blank',rel:'noopener noreferrer',style:{fontSize:11,color:'#FF5E5B',textDecoration:'none',fontWeight:600}},'Apoya Labora en Ko-Fi')),
    h('div',{style:{background:'white',borderTop:'1px solid #e2e8f0',display:'flex',flexShrink:0}},
      ...TABS.map(t=>{const act=navTab===t.id;return h('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'8px 0 10px',background:'none',border:'none',cursor:'pointer'}},
        h('span',{style:{fontSize:18,lineHeight:1}},t.emoji),
        act&&h('div',{style:{width:4,height:4,borderRadius:'50%',background:'#7c3aed'}}),
        h('span',{style:{fontSize:9,color:act?'#7c3aed':'#94a3b8',fontWeight:act?700:400}},t.label));})));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
