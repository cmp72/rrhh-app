const {useState,useEffect}=React;

const todayISO=()=>new Date().toISOString().split('T')[0];
const CY=new Date().getFullYear();
const CM=new Date().getMonth();
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_S=['L','M','X','J','V','S','D'];
const yearOf=iso=>parseInt(iso.slice(0,4),10);
const monthOf=iso=>parseInt(iso.slice(5,7),10)-1;
const fmt=iso=>new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtFecha=iso=>{const d=new Date(iso+'T00:00:00');return d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear();};

function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,dy);
}

function getFestivos(year,comunidad){
  const e=easter(year);
  const vs=new Date(e);vs.setDate(e.getDate()-2);
  const lp=new Date(e);lp.setDate(e.getDate()+1);
  const js=new Date(e);js.setDate(e.getDate()-3);
  const conLunes=['cataluna','c-valenciana','baleares','navarra','pais-vasco','la-rioja','murcia'];
  const f=[
    {d:new Date(year,0,1),n:'Año Nuevo'},
    {d:new Date(year,0,6),n:'Reyes Magos'},
    {d:vs,n:'Viernes Santo'},
    {d:new Date(year,4,1),n:'Día del Trabajo'},
    {d:new Date(year,9,12),n:'Fiesta Nacional'},
    {d:new Date(year,10,1),n:'Todos los Santos'},
    {d:new Date(year,11,6),n:'Día de la Constitución'},
    {d:new Date(year,11,8),n:'Inmaculada Concepción'},
    {d:new Date(year,11,25),n:'Navidad'},
  ];
  if(conLunes.includes(comunidad))f.push({d:lp,n:'Lunes de Pascua'});
  else f.push({d:js,n:'Jueves Santo'});
  if(comunidad==='cataluna'){
    f.push({d:new Date(year,5,24),n:'Sant Joan'});
    f.push({d:new Date(year,8,11),n:'La Diada'});
    f.push({d:new Date(year,11,26),n:'Sant Esteve'});
  }
  return f.sort((a,b)=>a.d-b.d);
}

function isoToDate(iso){return new Date(iso+'T00:00:00');}
function fmtISO(d){return d.toISOString().split('T')[0];}
function isWE(d){const dw=d.getDay();return dw===0||dw===6;}
function isFest(d,festivos){return festivos.some(f=>fmtISO(f.d)===fmtISO(d));}

function calcFin(ini,dias,tipo,festivos){
  let cur=new Date(ini+'T00:00:00'),contados=0,festUsados=0;
  while(contados<dias){
    const isF=isFest(cur,festivos),isW=isWE(cur);
    if(tipo==='laborables'){if(!isF&&!isW)contados++;else if(isF)festUsados++;}
    else{if(!isF)contados++;else festUsados++;}
    if(contados<dias)cur.setDate(cur.getDate()+1);
  }
  return{fin:fmtISO(cur),festUsados};
}

function weeksAndDays(isoTarget){
  const now=new Date();now.setHours(0,0,0,0);
  const tgt=new Date(isoTarget+'T00:00:00');
  const diff=Math.ceil((tgt-now)/86400000);
  if(diff<=0)return null;
  return{weeks:Math.floor(diff/7),days:diff%7,total:diff};
}

function nextCobro(dia){
  const now=new Date();now.setHours(0,0,0,0);
  let y=now.getFullYear(),m=now.getMonth();
  let cobro=new Date(y,m,dia);
  if(cobro<=now){m++;if(m>11){m=0;y++;}cobro=new Date(y,m,dia);}
  const diff=Math.ceil((cobro-now)/86400000);
  return{date:cobro,weeks:Math.floor(diff/7),days:diff%7,total:diff};
}

const lsLoad=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const lsSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.error(e);}};

function IconEdit(){return(<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>);}
function IconTrash(){return(<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>);}
function IconX({s=18}){return(<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);}

function Form({title,fields,initial,onSave,onCancel,color}){

    for(const f of fields)if(f.req&&!String(d[f.name]||'').trim()){alert('Completá: '+f.label);return;}
    onSave(d);
  };
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  return(
    <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',boxShadow:'0 2px 8px rgba(0,0,0,0.06)',padding:16,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span style={{fontWeight:700,color:'#1e293b'}}>{title}</span>
        <button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button>
      </div>
      {fields.map(f=>(
        <div key={f.name}>
          <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>{f.label}{f.req&&<span style={{color:'#ef4444'}}> *</span>}</label>
          {f.type==='textarea'
            ?<textarea rows={3} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={{...inp,resize:'none'}}/>
            :<input type={f.type||'text'} step={f.step} min={f.min} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={inp}/>
          }
        </div>
      ))}
      <div style={{display:'flex',gap:8,marginTop:4}}>
        <button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button>
        <button onClick={submit} style={{flex:1,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button>

function CobroSection(){
  const [dia,setDia]=useState(()=>parseInt(lsLoad('cobro-dia')||'28'));
  const [editando,setEditando]=useState(false);
  const [input,setInput]=useState('');
  const cobro=nextCobro(dia);
  const mes=cobro.date.toLocaleDateString('es-ES',{month:'long',year:'numeric'});

  const guardar=()=>{
    const n=parseInt(input);
    if(isNaN(n)||n<1||n>31){alert('Ingresá un día válido entre 1 y 31');return;}
    setDia(n);lsSave('cobro-dia',n);setEditando(false);
  };

  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <SHead emoji="💰" title="Próximo cobro" sub="Configura tu día de cobro" bg={ACCENT.purpleL}/>

        <div style={{fontSize:13,color:'#94a3b8',marginBottom:4}}>Fecha de cobro</div>
        <div style={{fontSize:22,fontWeight:800,color:'#1e293b',marginBottom:8}}>Día {dia} de {mes}</div>
        {!editando?(
          <button onClick={()=>{setInput(String(dia));setEditando(true);}} style={{fontSize:12,color:ACCENT.purple,background:'none',border:'none',cursor:'pointer',textDecoration:'underline',marginBottom:16}}>Cambiar día de cobro</button>
        ):(
          <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:16}}>
            <input type="number" min="1" max="31" value={input} onChange={e=>setInput(e.target.value)} style={{width:80,padding:'8px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:18,fontWeight:700,textAlign:'center'}} autoFocus/>
            <button onClick={guardar} style={{background:ACCENT.purple,border:'none',borderRadius:8,padding:'0 14px',cursor:'pointer',color:'white',display:'flex',alignItems:'center'}}><IconChk/></button>
            <button onClick={()=>setEditando(false)} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'0 10px',cursor:'pointer',color:'#64748b',display:'flex',alignItems:'center'}}><IconX/></button>
          </div>
        )}
        <div style={{background:ACCENT.purpleL,borderRadius:12,padding:'20px 16px',marginBottom:12}}>
          <div style={{fontSize:13,color:ACCENT.purple,fontWeight:600,marginBottom:8}}>Tiempo restante</div>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'center',gap:6,flexWrap:'wrap'}}>
            {cobro.weeks>0&&<><span style={{fontSize:52,fontWeight:900,color:ACCENT.purple,lineHeight:1}}>{cobro.weeks}</span><span style={{fontSize:16,color:ACCENT.purple,fontWeight:600}}>sem</span></>}
            {cobro.days>0&&<><span style={{fontSize:52,fontWeight:900,color:'#5b21b6',lineHeight:1,marginLeft:cobro.weeks>0?8:0}}>{cobro.days}</span><span style={{fontSize:16,color:'#5b21b6',fontWeight:600}}>día{cobro.days!==1?'s':''}</span></>}
            {cobro.weeks===0&&cobro.days===0&&<span style={{fontSize:28,fontWeight:800,color:ACCENT.emerald}}>¡Hoy cobras! 🎉</span>}
          </div>
        </div>
        <div style={{fontSize:13,color:'#94a3b8'}}>{cobro.total===1?'¡Mañana cobras! 🎉':`Faltan ${cobro.total} días en total`}</div>
      </div>

  );
}

function CalendarioVac({entries,festivos,calYear,calMonth,onChMes}){
  const vacDays=new Set();
  entries.forEach(e=>{
    if(!e.fin)return;
    let cur=new Date(e.fecha+'T00:00:00');
    const fin=new Date(e.fin+'T00:00:00');
    while(cur<=fin){vacDays.add(fmtISO(cur));cur.setDate(cur.getDate()+1);}
  });
  const todayStr=fmtISO(new Date());
  const first=new Date(calYear,calMonth,1);
  const startDay=(first.getDay()+6)%7;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const festMes=festivos.filter(f=>f.d.getMonth()===calMonth&&f.d.getFullYear()===calYear);

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <span style={{fontWeight:700,fontSize:15,color:'#1e293b'}}>{MESES[calMonth]} {calYear}</span>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>onChMes(-1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>‹</button>
          <button onClick={()=>onChMes(1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>›</button>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:8}}>
        {DIAS_S.map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:'#94a3b8',padding:'4px 0'}}>{d}</div>)}
        {Array(startDay).fill(null).map((_,i)=><div key={'e'+i}/>)}
        {Array(daysInMonth).fill(null).map((_,i)=>{
          const d=i+1;
          const date=new Date(calYear,calMonth,d);
          const ds=fmtISO(date);
          const isF=isFest(date,festivos);
          const isV=vacDays.has(ds);
          const isT=ds===todayStr;
          const isW=isWE(date);
          let bg='transparent',color=isW?'#94a3b8':'#1e293b',fw='normal';
          if(isT){bg='#1e293b';color='white';fw='700';}
          else if(isF){bg='#dbeafe';color='#2563eb';fw='700';}
          else if(isV){bg='#d1fae5';color='#065f46';}
          return(
            <div key={d} style={{textAlign:'center',padding:'5px 1px',borderRadius:6,fontSize:12,background:bg,color,fontWeight:fw,minHeight:28,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {d}
            </div>
          );
        })}
      </div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#2563eb'}}/>Festivo</div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#059669'}}/>Vacaciones</div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#1e293b'}}/>Hoy</div>
      </div>
      {festMes.length>0&&(
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {festMes.map((f,i)=>(
            <div key={i} style={{display:'flex',gap:10,background:'white',border:'1px solid #e2e8f0',borderRadius:8,padding:'8px 12px',alignItems:'center'}}>
              <span style={{fontSize:11,fontWeight:600,color:'#2563eb',minWidth:64}}>{f.d.getDate()} {MESES[f.d.getMonth()].slice(0,3)}</span>
              <span style={{fontSize:13,color:'#1e293b'}}>{f.n}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function VacSection({entries,totales,year,onUpdateE,onUpdateT}){
  const [form,setForm]=useState(false);
  const [ed,setEd]=useState(null);
  const [editT,setEditT]=useState(false);
  const [tInput,setTInput]=useState('');
  const [calYear,setCalYear]=useState(CY);
  const [calMonth,setCalMonth]=useState(CM);
  const [tipo,setTipo]=useState(()=>lsLoad('vac-tipo')||'laborables');
  const [comunidad,setComunidad]=useState(()=>lsLoad('vac-comunidad')||'cataluna');
  const [finCalc,setFinCalc]=useState('');
  const [festUsados,setFestUsados]=useState(0);

  const festivos=getFestivos(year,comunidad);
  const festCal=getFestivos(calYear,comunidad);

  const chMes=dir=>{
    let m=calMonth+dir,y=calYear;
    if(m>11){m=0;y++;}if(m<0){m=11;y--;}
    setCalYear(y);setCalMonth(m);
  };

  const yKey=String(year);
  const totalD=Number(totales[yKey]??0);
  const ye=entries.filter(e=>yearOf(e.fecha)===year);
  const hoy=new Date();hoy.setHours(23,59,59,0);

  const usados=ye.reduce((acc,e)=>{
    if(!e.fin)return acc+Number(e.dias||0);
    let cur=new Date(e.fecha+'T00:00:00');
    const fin=new Date(e.fin+'T00:00:00');
    while(cur<=fin){
      if(cur<=hoy){
        const isF=isFest(cur,festivos),isW=isWE(cur);
        if(tipo==='laborables'){if(!isF&&!isW)acc++;}
        else{if(!isF)acc++;}
      }
      cur.setDate(cur.getDate()+1);
    }
    return acc;
  },0);

  const rest=totalD-usados;
  const pct=totalD>0?Math.min(100,(usados/totalD)*100):0;
  const futuras=entries.filter(e=>new Date(e.fecha+'T00:00:00')>new Date()).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const proximas=futuras[0]||null;
  const countdown=proximas?weeksAndDays(proximas.fecha):null;

  const abrirTotal=()=>{setTInput(String(totalD||''));setEditT(true);};
  const guardarTotal=()=>{const n=parseInt(tInput,10);if(isNaN(n)||n<0){alert('Ingresá un número válido');return;}onUpdateT({...totales,[yKey]:n});setEditT(false);};

  const onIniChange=(ini,dias)=>{
    if(!ini||!dias)return;
    const {fin,festUsados:fu}=calcFin(ini,parseInt(dias),tipo,festivos);
    setFinCalc(fin);setFestUsados(fu);
  };

  const F=[
    {name:'fecha',label:'Fecha de inicio',type:'date',req:true},
    {name:'dias',label:'Cantidad de días ('+tipo+')',type:'number',min:'1',step:'1',req:true,ph:'Ej: 5'},
    {name:'desc',label:'Nota (opcional)',type:'textarea',ph:'Ej: vacaciones de verano'},
  ];

  const save=e=>{
    const dias=Number(e.dias)||0;
    const {fin}=calcFin(e.fecha,dias,tipo,festivos);
    const c={...e,dias,fin};
    if(ed){onUpdateE(entries.map(i=>i.id===ed.id?{...c,id:ed.id}:i));setEd(null);}

          <Item key={it.id} item={it} onEdit={setEd} onDelete={id=>onUpdate(items.filter(i=>i.id!==id))}>
            <div style={{fontSize:12,color:'#94a3b8'}}>{fmt(it.fecha)}</div>
            {it.titulo&&<div style={{fontSize:14,fontWeight:700,color:'#1e293b',marginTop:3}}>{it.titulo}</div>}
            <div style={{fontSize:13,color:'#475569',marginTop:3,wordBreak:'break-word'}}>{it.desc}</div>
          </Item>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState('vacaciones');
  const [year,setYear]=useState(CY);
  const [fallos,setFallos]=useState([]);
  const [horas,setHoras]=useState([]);
  const [vacE,setVacE]=useState([]);
  const [vacT,setVacT]=useState({});
  const [incid,setIncid]=useState([]);

  useEffect(()=>{
    const f=lsLoad('fallos');if(Array.isArray(f))setFallos(f);
    const h=lsLoad('horas');if(Array.isArray(h))setHoras(h);
    const ve=lsLoad('vac-e');if(Array.isArray(ve))setVacE(ve);
    const vt=lsLoad('vac-t');if(vt&&typeof vt==='object')setVacT(vt);
    const i=lsLoad('incid');if(Array.isArray(i))setIncid(i);
  },[]);

  const sf=d=>{setFallos(d);lsSave('fallos',d);};
  const sh=d=>{setHoras(d);lsSave('horas',d);};
  const sve=d=>{setVacE(d);lsSave('vac-e',d);};
  const svt=d=>{setVacT(d);lsSave('vac-t',d);};
  const si=d=>{setIncid(d);lsSave('incid',d);};

  const ys=[];for(let y=CY+1;y>=CY-4;y--)ys.push(y);
  const showYear=tab!=='cobro';

  const TABS=[
    {id:'vacaciones',label:'Vacaciones',emoji:'🌴'},
    {id:'cobro',label:'Cobro',emoji:'💰'},
    {id:'fallos',label:'Fallos',emoji:'⚠️'},
    {id:'horas',label:'H.Extras',emoji:'⏱️'},
    {id:'incidencias',label:'Más',emoji:'📋'},
  ];

  return(
    <div style={{minHeight:'100svh',display:'flex',flexDirection:'column',background:'#f8fafc',fontFamily:'system-ui,-apple-system,sans-serif'}}>
      <div style={{background:'#1e293b',color:'white',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <span style={{fontSize:20}}>💼</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:15}}>Recursos Humanos</div>
          <div style={{fontSize:11,color:'#94a3b8'}}>Panel de seguimiento</div>
        </div>
        {showYear&&(
          <div style={{position:'relative'}}>
            <select value={year} onChange={e=>setYear(Number(e.target.value))}
              style={{appearance:'none',background:'#334155',color:'white',border:'none',borderRadius:8,padding:'6px 28px 6px 10px',fontWeight:600,fontSize:14,cursor:'pointer'}}>
              {ys.map(y=><option key={y} value={y}>{y}</option>)}
            </select>
            <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:10}}>▾</span>
          </div>
        )}
      </div>

      <div style={{flex:1,overflowY:'auto',padding:16,paddingBottom:80}}>
        {tab==='vacaciones'&&<VacSection entries={vacE} totales={vacT} year={year} onUpdateE={sve} onUpdateT={svt}/>}
        {tab==='cobro'&&<CobroSection/>}
        {tab==='fallos'&&<FallosSection items={fallos} year={year} onUpdate={sf}/>}
        {tab==='horas'&&<HorasSection items={horas} year={year} onUpdate={sh}/>}
        {tab==='incidencias'&&<IncidSection items={incid} year={year} onUpdate={si}/>}
      </div>

      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'white',borderTop:'1px solid #e2e8f0',display:'grid',gridTemplateColumns:'repeat(5,1fr)',zIndex:99}}>
        {TABS.map(({id,label,emoji})=>{
          const active=tab===id;
          return(
            <button key={id} onClick={()=>setTab(id)}
              style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'7px 2px',background:active?'#f8fafc':'white',border:'none',cursor:'pointer'}}>
              <span style={{fontSize:19,lineHeight:1}}>{emoji}</span>
              <span style={{fontSize:9,fontWeight:600,marginTop:2,color:active?'#1e293b':'#94a3b8',whiteSpace:'nowrap'}}>{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
