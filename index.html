<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const CY=new Date().getFullYear();
const CM=new Date().getMonth();
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS_S=['L','M','X','J','V','S','D'];
const yearOf=iso=>parseInt(iso.slice(0,4),10);
const monthOf=iso=>parseInt(iso.slice(5,7),10)-1;
const fmt=iso=>new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const fmtLargo=iso=>{const d=new Date(iso+'T12:00:00');return d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear();};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isWE=d=>{const dw=d.getDay();return dw===0||dw===6;};
const dateToISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sameFecha=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const getMondayOf=d=>{const r=new Date(d);const day=r.getDay();const diff=day===0?-6:1-day;r.setDate(r.getDate()+diff);r.setHours(0,0,0,0);return r;};

const lsLoad=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const lsSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

function weeksAndDays(isoTarget){
  const now=new Date();now.setHours(0,0,0,0);
  const tgt=new Date(isoTarget+'T12:00:00');
  const diff=Math.ceil((tgt-now)/86400000);
  if(diff<=0)return null;
  return{weeks:Math.floor(diff/7),days:diff%7,total:diff};
}
function nextCobro(dia){
  const now=new Date();now.setHours(0,0,0,0);
  let y=now.getFullYear(),m=now.getMonth();
  let cobro=new Date(y,m,dia);
  if(cobro<=now){m++;if(m>11){m=0;y++;}cobro=new Date(y,m,dia);}
  const diff=Math.ceil((cobro-now)/86400000);
  return{date:cobro,weeks:Math.floor(diff/7),days:diff%7,total:diff};
}
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),
    dy=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,dy);
}
function getFestivos(year,comunidad){
  const e=easter(year);
  const vs=new Date(e);vs.setDate(e.getDate()-2);
  const lp=new Date(e);lp.setDate(e.getDate()+1);
  const js=new Date(e);js.setDate(e.getDate()-3);
  const conLunes=['cataluna','c-valenciana','baleares','navarra','pais-vasco','la-rioja','murcia'];
  const f=[
    {d:new Date(year,0,1),n:'Año Nuevo'},{d:new Date(year,0,6),n:'Reyes Magos'},
    {d:vs,n:'Viernes Santo'},{d:new Date(year,4,1),n:'Día del Trabajo'},
    {d:new Date(year,9,12),n:'Fiesta Nacional'},{d:new Date(year,10,1),n:'Todos los Santos'},
    {d:new Date(year,11,6),n:'Día de la Constitución'},{d:new Date(year,11,8),n:'Inmaculada Concepción'},
    {d:new Date(year,11,25),n:'Navidad'},
  ];
  if(conLunes.includes(comunidad))f.push({d:lp,n:'Lunes de Pascua'});
  else f.push({d:js,n:'Jueves Santo'});
  if(comunidad==='cataluna'){
    f.push({d:new Date(year,5,24),n:'Sant Joan'});
    f.push({d:new Date(year,8,11),n:'La Diada'});
    f.push({d:new Date(year,11,26),n:'Sant Esteve'});
  }
  return f.sort((a,b)=>a.d-b.d);
}
function isFest(d,festivos){return festivos.some(f=>sameFecha(f.d,d));}
function calcFin(ini,dias,tipo,festivos){
  const cur=new Date(ini+'T12:00:00');let contados=0,festUsados=0;
  while(true){
    const isF=isFest(cur,festivos),isW=isWE(cur);
    if(tipo==='laborables'){if(!isF&&!isW)contados++;else if(isF)festUsados++;}
    else{if(!isF)contados++;else festUsados++;}
    if(contados>=dias)break;
    cur.setDate(cur.getDate()+1);
  }
  return{fin:dateToISO(cur),festUsados};
}
function diasUsados(e,tipo,comunidad,hoy){
  const dias=Number(e.dias||0);if(dias===0)return 0;
  const ini=new Date(e.fecha+'T12:00:00');if(ini>hoy)return 0;
  const fests=getFestivos(yearOf(e.fecha),comunidad);
  const cur=new Date(ini);let contados=0,usados=0;
  while(cur<=hoy&&contados<dias){
    const isF=isFest(cur,fests),isW=isWE(cur);
    if(tipo==='laborables'){if(!isF&&!isW){contados++;usados++;}}
    else{if(!isF){contados++;usados++;}}
    cur.setDate(cur.getDate()+1);
  }
  return usados;
}

const ACCENT={
  red:'#dc2626',redL:'#fee2e2',blue:'#2563eb',blueL:'#dbeafe',
  emerald:'#059669',emeraldL:'#d1fae5',amber:'#d97706',amberL:'#fef3c7',
  purple:'#7c3aed',purpleL:'#ede9fe',teal:'#0d9488',tealL:'#ccfbf1',
};

const TURNO_COLORS={

  'Tarde':{bg:'#dbeafe',color:'#1e3a8a',border:'#93c5fd'},
  'Noche':{bg:'#ede9fe',color:'#4c1d95',border:'#c4b5fd'},

// ─── SHARED ───────────────────────────────────────────────────────
function FiltroMes({year,items,mesActivo,onMes,color}){
  const ref=useRef(null);
  const mesesConDatos=new Set(items.filter(i=>yearOf(i.fecha)===year).map(i=>monthOf(i.fecha)));
  useEffect(()=>{
    if(ref.current&&mesActivo!==null){
      const btn=ref.current.querySelector(`[data-m="${mesActivo}"]`);
      if(btn)btn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    }
  },[mesActivo]);
  return(<div ref={ref} className="mes-scroll" style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:4}}>
    <button onClick={()=>onMes(null)} style={{flexShrink:0,padding:'6px 14px',borderRadius:20,border:'1px solid '+(mesActivo===null?color:'#e2e8f0'),background:mesActivo===null?color:'white',color:mesActivo===null?'white':'#64748b',fontWeight:600,fontSize:12,cursor:'pointer'}}>Todos</button>
    {MESES_C.map((m,i)=>{const activo=mesActivo===i,tiene=mesesConDatos.has(i);return(<button key={i} data-m={i} onClick={()=>onMes(activo?null:i)} style={{flexShrink:0,padding:'6px 12px',borderRadius:20,border:'1px solid '+(activo?color:tiene?'#e2e8f0':'#f1f5f9'),background:activo?color:'white',color:activo?'white':tiene?'#475569':'#cbd5e1',fontWeight:activo||tiene?600:400,fontSize:12,cursor:'pointer',opacity:tiene||activo?1:0.5}}>{m}</button>);})}
  </div>);
}
function Stat({label,value,unit,color}){return(<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:'10px 12px',flex:1,minWidth:0}}><div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.05em',color:'#94a3b8',fontWeight:600}}>{label}</div><div style={{fontSize:26,fontWeight:800,color,marginTop:2,lineHeight:1}}>{value}</div><div style={{fontSize:11,color:'#94a3b8',marginTop:2}}>{unit}</div></div>);}
function SHead({emoji,title,sub,bg}){return(<div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:40,height:40,borderRadius:12,background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{emoji}</div><div><div style={{fontWeight:800,fontSize:16,color:'#1e293b'}}>{title}</div><div style={{fontSize:11,color:'#94a3b8'}}>{sub}</div></div></div>);}
function AddBtn({label,color,onClick}){return(<button onClick={onClick} style={{width:'100%',background:color,color:'white',border:'none',borderRadius:12,padding:'13px 0',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontWeight:600,fontSize:15,cursor:'pointer'}}><span style={{fontSize:20,lineHeight:1}}>+</span>{label}</button>);}
function IconEdit(){return(<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>);}
function IconTrash(){return(<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>);}
function IconX({s=18}){return(<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);}
function IconChk(){return(<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>);}
function Item({item,onEdit,onDelete,children}){
  const [conf,setConf]=useState(false);
  return(<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:12,display:'flex',gap:8}}>
    <div style={{flex:1,minWidth:0}}>{children}</div>
    <div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
      {!conf?<><button onClick={()=>onEdit(item)} style={{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}}><IconEdit/></button><button onClick={()=>setConf(true)} style={{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}}><IconTrash/></button></>
      :<><button onClick={()=>{onDelete(item.id);setConf(false);}} style={{padding:'6px 8px',background:'#dc2626',border:'none',borderRadius:8,cursor:'pointer',color:'white',fontWeight:800,fontSize:11}}>OK</button><button onClick={()=>setConf(false)} style={{padding:6,background:'#f1f5f9',border:'none',borderRadius:8,cursor:'pointer',color:'#64748b'}}><IconX s={14}/></button></>}
    </div>
  </div>);
}
function Empty({text}){return <div style={{background:'white',borderRadius:12,border:'2px dashed #cbd5e1',padding:32,textAlign:'center',color:'#94a3b8',fontSize:14}}>{text}</div>;}
function Form({title,fields,initial,onSave,onCancel,color}){
  const [d,setD]=useState({...initial});
  const submit=()=>{for(const f of fields)if(f.req&&!String(d[f.name]||'').trim()){alert('Completa: '+f.label);return;}onSave(d);};
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  return(<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,color:'#1e293b'}}>{title}</span><button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button></div>
    {fields.map(f=>(<div key={f.name}><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>{f.label}{f.req&&<span style={{color:'#ef4444'}}> *</span>}</label>
      {f.type==='textarea'?<textarea rows={3} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={{...inp,resize:'none'}}/>
      :<input type={f.type||'text'} step={f.step} min={f.min} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={inp}/>}
    </div>))}
    <div style={{display:'flex',gap:8,marginTop:4}}>
      <button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button>
      <button onClick={submit} style={{flex:1,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button>
    </div>
  </div>);
}
function FotoViewer({src,onClose}){return(<div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}><img src={src} style={{maxWidth:'100%',maxHeight:'90vh',borderRadius:8,objectFit:'contain'}}/><button onClick={onClose} style={{position:'absolute',top:16,right:16,background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:36,height:36,color:'white',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>x</button></div>);}
function FotosPicker({fotos,onChange}){
  const [viewer,setViewer]=useState(null);
  const agregar=e=>{const files=Array.from(e.target.files).slice(0,3-fotos.length);files.forEach(f=>{const r=new FileReader();r.onload=ev=>onChange([...fotos,ev.target.result]);r.readAsDataURL(f);});e.target.value='';};
  const borrar=i=>onChange(fotos.filter((_,fi)=>fi!==i));
  return(<div>{viewer&&<FotoViewer src={viewer} onClose={()=>setViewer(null)}/>}<div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}>{fotos.map((f,i)=>(<div key={i} style={{position:'relative'}}><img src={f} onClick={()=>setViewer(f)} style={{width:72,height:72,borderRadius:8,objectFit:'cover',border:'1px solid #e2e8f0',cursor:'pointer'}}/><button onClick={()=>borrar(i)} style={{position:'absolute',top:-6,right:-6,width:18,height:18,borderRadius:'50%',background:'#dc2626',border:'none',color:'white',fontSize:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>x</button></div>))}{fotos.length<3&&(<label style={{width:72,height:72,borderRadius:8,border:'2px dashed #cbd5e1',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:24,color:'#94a3b8',background:'#f8fafc'}}>+<input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={agregar}/></label>)}</div></div>);
}
function IncidForm({initial,onSave,onCancel,color}){
  const [d,setD]=useState({...initial});const [fotos,setFotos]=useState(initial.fotos||[]);
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const submit=()=>{if(!d.fecha){alert('Ingresa la fecha');return;}if(!String(d.titulo||'').trim()){alert('Ingresa el titulo');return;}if(!String(d.desc||'').trim()){alert('Ingresa la descripcion');return;}onSave({...d,fotos});};
  return(<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,color:'#1e293b'}}>{initial.id?'Editar incidencia':'Nueva incidencia'}</span><button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fecha *</label><input type="date" value={d.fecha||''} onChange={e=>setD({...d,fecha:e.target.value})} style={inp}/></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Titulo *</label><input type="text" placeholder="Ej: Fallo de maquina" value={d.titulo||''} onChange={e=>setD({...d,titulo:e.target.value})} style={inp}/></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Descripcion *</label><textarea rows={3} placeholder="Detalla la incidencia..." value={d.desc||''} onChange={e=>setD({...d,desc:e.target.value})} style={{...inp,resize:'none'}}/></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fotos (max. 3)</label><FotosPicker fotos={fotos} onChange={setFotos}/></div>
    <div style={{display:'flex',gap:8}}><button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button><button onClick={submit} style={{flex:2,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button></div>
  </div>);
}
function IncidItem({it,onEdit,onDelete}){
  const [viewer,setViewer]=useState(null);
  return(<Item item={it} onEdit={onEdit} onDelete={onDelete}>{viewer&&<FotoViewer src={viewer} onClose={()=>setViewer(null)}/>}<div style={{fontSize:12,color:'#94a3b8'}}>{fmt(it.fecha)}</div>{it.titulo&&<div style={{fontSize:14,fontWeight:700,color:'#1e293b',marginTop:3}}>{it.titulo}</div>}<div style={{fontSize:13,color:'#475569',marginTop:3,wordBreak:'break-word'}}>{it.desc}</div>{it.fotos&&it.fotos.length>0&&(<div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>{it.fotos.map((f,fi)=><img key={fi} src={f} onClick={()=>setViewer(f)} style={{width:60,height:60,borderRadius:6,objectFit:'cover',border:'1px solid #e2e8f0',cursor:'pointer'}}/>)}</div>)}</Item>);
}

// ─── CALENDARIO VAC ───────────────────────────────────────────────
function Calendario({entries,festivos,calYear,calMonth,onChMes,tipo,comunidad}){
  const vacDays=new Set();
  entries.forEach(e=>{
    if(!e.dias||Number(e.dias)<1)return;
    const fests=getFestivos(yearOf(e.fecha),comunidad);
    const r=calcFin(e.fecha,Number(e.dias),tipo,fests);
    const cur=new Date(e.fecha+'T12:00:00');const fin=new Date(r.fin+'T12:00:00');
    while(cur<=fin){const isF=isFest(cur,fests),isW=isWE(cur);if(tipo==='laborables'?(!isF&&!isW):(!isF))vacDays.add(dateToISO(cur));cur.setDate(cur.getDate()+1);}
  });
  const todayStr=todayISO();
  const first=new Date(calYear,calMonth,1);const startDay=(first.getDay()+6)%7;const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const festMes=festivos.filter(f=>f.d.getMonth()===calMonth&&f.d.getFullYear()===calYear);
  return(<div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <span style={{fontWeight:700,fontSize:15,color:'#1e293b'}}>{MESES[calMonth]} {calYear}</span>
      <div style={{display:'flex',gap:8}}><button onClick={()=>onChMes(-1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8249;</button><button onClick={()=>onChMes(1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8250;</button></div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:8}}>
      {DIAS_S.map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:'#94a3b8',padding:'4px 0'}}>{d}</div>)}
      {Array(startDay).fill(null).map((_,i)=><div key={'e'+i}/>)}
      {Array(daysInMonth).fill(null).map((_,i)=>{
        const d=i+1,date=new Date(calYear,calMonth,d),ds=dateToISO(date);
        const isF=isFest(date,festivos),isV=vacDays.has(ds),isT=ds===todayStr,isW=isWE(date);
        let bg='transparent',color=isW?'#94a3b8':'#1e293b',fw='normal';
        if(isT){bg='#1e293b';color='white';fw='700';}else if(isF){bg='#dbeafe';color='#2563eb';fw='700';}else if(isV){bg='#d1fae5';color='#065f46';}

      })}

  </div>);
}

// ─── TURNOS ───────────────────────────────────────────────────────
function calcTurnoAuto(monday,turnosList,frecuencia,anclaISO,anclaIdx){
  if(!turnosList||turnosList.length===0||!anclaISO)return null;
  const anclaMonday=getMondayOf(new Date(anclaISO+'T12:00:00'));
  const diffSemanas=Math.round((getMondayOf(monday)-anclaMonday)/(7*86400000));
  const bloque=Math.floor(diffSemanas/frecuencia);
  const idx=((anclaIdx+bloque)%turnosList.length+turnosList.length)%turnosList.length;
  return turnosList[idx];
}

function TurnosSection({turnos:cfg,onUpdate}){
  const [calYear,setCalYear]=useState(CY);
  const [calMonth,setCalMonth]=useState(CM);

  const turnosList=cfg.turnosList||[];
  const frecuencia=cfg.frecuencia||1;
  const anclaISO=cfg.anclaISO||null;
  const anclaIdx=cfg.anclaIdx??0;
  const overrides=cfg.overrides||{};
  const configured=turnosList.length>=2&&anclaISO;

  const PRESETS=[
    {label:'Mañana / Tarde',turnos:['Mañana','Tarde']},
    {label:'Mañana / Tarde / Noche',turnos:['Mañana','Tarde','Noche']},
  ];
  const FREQS=[
    {label:'Cada semana',v:1},
    {label:'Cada 2 semanas',v:2},
    {label:'Cada 3 semanas',v:3},
    {label:'Mensual (4 sem)',v:4},
  ];

  const getTurnoSemana=monday=>{
    const k=dateToISO(monday);
    if(overrides[k]!==undefined)return{turno:overrides[k],override:true};
    return{turno:calcTurnoAuto(monday,turnosList,frecuencia,anclaISO,anclaIdx),override:false};
  };

  const setOverride=(monday,turno)=>{
    const k=dateToISO(monday);
    const auto=calcTurnoAuto(monday,turnosList,frecuencia,anclaISO,anclaIdx);
    const nov={...overrides};
    if(turno===null||turno===auto)delete nov[k]; else nov[k]=turno;
    onUpdate({...cfg,overrides:nov});
  };

  const chMes=dir=>{let m=calMonth+dir,y=calYear;if(m>11){m=0;y++;}if(m<0){m=11;y--;}setCalYear(y);setCalMonth(m);};
  const getMondaysOfMonth=(y,m)=>{
    const res=[];const first=new Date(y,m,1);const last=new Date(y,m+1,0);
    const cur=getMondayOf(first);
    while(cur<=last){res.push(new Date(cur));cur.setDate(cur.getDate()+7);}
    return res;
  };
  const mondays=getMondaysOfMonth(calYear,calMonth);
  const todayMondayStr=dateToISO(getMondayOf(new Date()));
  const turnoActual=configured?getTurnoSemana(getMondayOf(new Date())).turno:null;

  const presetActivo=PRESETS.findIndex(p=>JSON.stringify(p.turnos)===JSON.stringify(turnosList));

  return(<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <SHead emoji="🔄" title="Turnos" sub="Rotación automática" bg={ACCENT.amberL}/>

    {/* Turno esta semana */}
    <div style={{background:turnoActual?tc(turnoActual).bg:'#f8fafc',borderRadius:14,border:'2px solid '+(turnoActual?tc(turnoActual).border:'#e2e8f0'),padding:18,textAlign:'center'}}>
      <div style={{fontSize:11,color:'#94a3b8',fontWeight:600,textTransform:'uppercase',marginBottom:6}}>Esta semana</div>
      <div style={{fontSize:38,fontWeight:900,color:turnoActual?tc(turnoActual).color:'#cbd5e1'}}>{turnoActual||'—'}</div>
    </div>

    {/* Configuración */}
    <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:16}}>

      {/* Paso 1 */}
      <div>
        <div style={{fontSize:12,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>1. ¿Qué turnos tienes?</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {PRESETS.map((p,i)=>{
            const sel=presetActivo===i;
            return(<button key={i} onClick={()=>onUpdate({...cfg,turnosList:p.turnos,anclaIdx:0,overrides:{}})}
              style={{padding:'14px 16px',borderRadius:12,border:'2px solid '+(sel?ACCENT.amber:'#e2e8f0'),background:sel?'#fffbeb':'white',textAlign:'left',cursor:'pointer',fontWeight:700,fontSize:15,color:sel?ACCENT.amber:'#475569',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:20}}>{i===0?'☀️':'🌙'}</span>
              <span>{p.label}</span>
              {sel&&<span style={{marginLeft:'auto',fontSize:18}}>✓</span>}
            </button>);
          })}
        </div>
      </div>

      {/* Paso 2 */}
      {turnosList.length>=2&&<div>
        <div style={{fontSize:12,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>2. ¿Cada cuánto cambia?</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {FREQS.map(f=>(
            <button key={f.v} onClick={()=>onUpdate({...cfg,frecuencia:f.v,overrides:{}})}
              style={{padding:'10px 14px',borderRadius:20,border:'2px solid '+(frecuencia===f.v?ACCENT.amber:'#e2e8f0'),background:frecuencia===f.v?'#fffbeb':'white',cursor:'pointer',fontWeight:600,fontSize:13,color:frecuencia===f.v?ACCENT.amber:'#475569'}}>
              {f.label}
            </button>
          ))}
        </div>
      </div>}

      {/* Paso 3 */}
      {turnosList.length>=2&&<div>
        <div style={{fontSize:12,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>3. ¿Qué turno tienes esta semana?</div>
        <div style={{display:'flex',gap:10}}>
          {turnosList.map((t,i)=>(
            <button key={i} onClick={()=>onUpdate({...cfg,anclaISO:dateToISO(getMondayOf(new Date())),anclaIdx:i,overrides:{}})}
              style={{flex:1,padding:'16px 8px',borderRadius:12,border:'2px solid '+(anclaIdx===i&&anclaISO?tc(t).border:'#e2e8f0'),background:anclaIdx===i&&anclaISO?tc(t).bg:'white',cursor:'pointer',fontWeight:800,fontSize:18,color:anclaIdx===i&&anclaISO?tc(t).color:'#94a3b8',textAlign:'center'}}>
              {t}
              {anclaIdx===i&&anclaISO&&<div style={{fontSize:11,marginTop:4}}>✓ seleccionado</div>}
            </button>
          ))}
        </div>
        {configured&&<div style={{fontSize:11,color:ACCENT.emerald,marginTop:8,fontWeight:600,textAlign:'center'}}>✓ Rotación configurada — el calendario se calcula automáticamente</div>}
      </div>}
    </div>

    {/* Calendario */}
    {configured&&<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <span style={{fontWeight:700,fontSize:15,color:'#1e293b'}}>{MESES[calMonth]} {calYear}</span>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>chMes(-1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8249;</button>
          <button onClick={()=>chMes(1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8250;</button>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {mondays.map((mon,idx)=>{
          const fri=new Date(mon);fri.setDate(mon.getDate()+4);
          const isNow=dateToISO(mon)===todayMondayStr;
          const {turno,override}=getTurnoSemana(mon);
          const tStyle=turno?tc(turno):{bg:'#f8fafc',color:'#94a3b8',border:'#e2e8f0'};
          return(<div key={idx} style={{border:'2px solid '+(isNow?ACCENT.amber:'#e2e8f0'),borderRadius:10,overflow:'hidden',background:isNow?'#fffbeb':'white'}}>
            <div style={{display:'flex',alignItems:'center',padding:'8px 12px',gap:8}}>
              <div style={{flex:1}}>
                {isNow&&<div style={{fontSize:10,fontWeight:700,color:ACCENT.amber}}>← Esta semana</div>}
                <div style={{fontSize:13,fontWeight:600,color:'#1e293b'}}>{mon.getDate()} {MESES_C[mon.getMonth()]} – {fri.getDate()} {MESES_C[fri.getMonth()]}</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2}}>
                <div style={{fontSize:13,fontWeight:700,color:tStyle.color,background:tStyle.bg,border:'1px solid '+tStyle.border,borderRadius:20,padding:'4px 12px'}}>{turno||'—'}</div>
                {override&&<div style={{fontSize:9,color:ACCENT.amber,fontWeight:700}}>modificado</div>}
              </div>
            </div>
            <div className="mes-scroll" style={{display:'flex',gap:6,padding:'0 12px 10px',overflowX:'auto'}}>
              {turnosList.map(t=>(<button key={t} onClick={()=>setOverride(mon,turno===t&&override?null:t)}
                style={{flexShrink:0,padding:'5px 14px',borderRadius:20,border:'2px solid '+(turno===t?tc(t).border:'#e2e8f0'),background:turno===t?tc(t).bg:'white',color:turno===t?tc(t).color:'#64748b',fontSize:12,fontWeight:600,cursor:'pointer'}}>
                {t}
              </button>))}
              {override&&<button onClick={()=>setOverride(mon,null)} style={{flexShrink:0,padding:'5px 10px',borderRadius:20,border:'1px solid #e2e8f0',background:'white',color:'#94a3b8',fontSize:11,cursor:'pointer'}}>↩ auto</button>}
            </div>
          </div>);
        })}
      </div>
    </div>}
  </div>);
}

// ─── NÓMINA ───────────────────────────────────────────────────────
const MESES_EXTRA=[5,11];
function NominaSection({nominas,onUpdate}){
  const [year,setYear]=useState(CY);const [form,setForm]=useState(false);const [ed,setEd]=useState(null);
  const yn=nominas.filter(n=>n.year===year);
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const total=yn.reduce((s,n)=>s+Number(n.importe||0)+(MESES_EXTRA.includes(n.mes)?Number(n.extra||0):0),0);
  const media=yn.length>0?(total/yn.length).toFixed(0):0;
  const getDiff=mes=>{const a=yn.find(n=>n.mes===mes);const b=yn.find(n=>n.mes===mes-1);if(!a||!b)return null;return Number(a.importe)-Number(b.importe);};
  const getNom=mes=>yn.find(n=>n.mes===mes)||null;
  const save=data=>{
    const item={...data,year,mes:parseInt(data.mes),importe:parseFloat(data.importe)||0,extra:parseFloat(data.extra||0)||0};
    if(ed){onUpdate(nominas.map(n=>n.id===ed.id?{...item,id:ed.id}:n));setEd(null);}
    else{const ex=nominas.find(n=>n.year===year&&n.mes===parseInt(data.mes));if(ex)onUpdate(nominas.map(n=>n.id===ex.id?{...item,id:ex.id}:n));else onUpdate([...nominas,{...item,id:uid()}]);setForm(false);}
  };
  const ys=[];for(let y=CY+1;y>=CY-4;y--)ys.push(y);
  return(<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <SHead emoji="💵" title="Nómina" sub="Historial de cobros" bg={ACCENT.tealL}/>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:'12px 16px'}}>
      <span style={{fontWeight:700,color:'#1e293b'}}>Año</span>
      <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{appearance:'none',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:8,padding:'6px 12px',fontWeight:600,fontSize:14,cursor:'pointer',color:'#1e293b'}}>{ys.map(y=><option key={y} value={y}>{y}</option>)}</select>
    </div>
    {yn.length>0&&<div style={{display:'flex',gap:10}}><Stat label="Total año" value={total.toLocaleString('es-ES')+'€'} unit={yn.length+' nóminas'} color={ACCENT.teal}/><Stat label="Media mensual" value={Number(media).toLocaleString('es-ES')+'€'} unit="por mes" color={ACCENT.teal}/></div>}
    <AddBtn label="Registrar nómina" color={ACCENT.teal} onClick={()=>{setEd(null);setForm(true);}}/>
    {(form||ed)&&(<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,color:'#1e293b'}}>{ed?'Editar nómina':'Nueva nómina'}</span><button onClick={()=>{setForm(false);setEd(null);}} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button></div>
      <NominaForm initial={ed||{mes:String(CM),importe:'',extra:'',notas:''}} onSave={save} onCancel={()=>{setForm(false);setEd(null);}} color={ACCENT.teal} inp={inp}/>
    </div>)}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
      {MESES.map((mes,i)=>{
        const nom=getNom(i);const diff=getDiff(i);const esE=MESES_EXTRA.includes(i);const esA=i===CM&&year===CY;
        return(<div key={i} onClick={()=>{if(nom){setEd(nom);setForm(false);}else{setEd(null);setForm(true);}}} style={{background:nom?'white':'#f8fafc',borderRadius:12,border:'2px solid '+(esA?ACCENT.teal:nom?'#e2e8f0':'#f1f5f9'),padding:12,cursor:'pointer',position:'relative'}}>
          {esE&&<div style={{position:'absolute',top:6,right:8,fontSize:9,fontWeight:700,color:ACCENT.amber}}>+Extra</div>}
          <div style={{fontSize:11,fontWeight:700,color:esA?ACCENT.teal:'#94a3b8',marginBottom:4}}>{MESES_C[i]}</div>
          {nom?(<>
            <div style={{fontSize:18,fontWeight:800,color:'#1e293b'}}>{Number(nom.importe).toLocaleString('es-ES')}€</div>
            {esE&&nom.extra>0&&<div style={{fontSize:11,color:ACCENT.amber,fontWeight:600}}>+{Number(nom.extra).toLocaleString('es-ES')}€</div>}
            {diff!==null&&<div style={{fontSize:11,marginTop:2,fontWeight:600,color:diff>0?ACCENT.emerald:diff<0?ACCENT.red:'#94a3b8'}}>{diff>0?'▲':'▼'} {Math.abs(diff).toLocaleString('es-ES')}€</div>}
          </>):(<div style={{fontSize:12,color:'#cbd5e1',marginTop:4}}>Toca para añadir</div>)}
        </div>);
      })}
    </div>
    {yn.length>0&&(<div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div style={{fontSize:12,fontWeight:700,color:'#94a3b8',textTransform:'uppercase'}}>Detalle</div>
      {[...yn].sort((a,b)=>b.mes-a.mes).map(n=>{
        const diff=getDiff(n.mes);const esE=MESES_EXTRA.includes(n.mes);const tot=Number(n.importe)+(esE?Number(n.extra||0):0);
        return(<Item key={n.id} item={n} onEdit={i=>{setEd(i);setForm(false);}} onDelete={id=>onUpdate(nominas.filter(x=>x.id!==id))}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
            <div><div style={{fontSize:13,fontWeight:700,color:'#1e293b'}}>{MESES[n.mes]} {year}</div>{esE&&n.extra>0&&<div style={{fontSize:11,color:ACCENT.amber}}>+ paga extra</div>}</div>
            <div style={{textAlign:'right'}}><div style={{fontSize:18,fontWeight:800,color:ACCENT.teal}}>{tot.toLocaleString('es-ES')}€</div>{diff!==null&&<div style={{fontSize:11,fontWeight:600,color:diff>0?ACCENT.emerald:diff<0?ACCENT.red:'#94a3b8'}}>{diff>0?'▲ +':'▼ '}{diff.toLocaleString('es-ES')}€</div>}</div>
          </div>
          {n.notas&&<div style={{fontSize:12,color:'#64748b',marginTop:4}}>{n.notas}</div>}
        </Item>);
      })}
    </div>)}
    {yn.length===0&&<Empty text="Sin nóminas registradas este año"/>}
  </div>);
}
function NominaForm({initial,onSave,onCancel,color,inp}){
  const [mes,setMes]=useState(String(initial.mes||CM));const [importe,setImporte]=useState(String(initial.importe||''));const [extra,setExtra]=useState(String(initial.extra||''));const [notas,setNotas]=useState(initial.notas||'');
  const esE=MESES_EXTRA.includes(parseInt(mes));
  const submit=()=>{if(!importe||parseFloat(importe)<0){alert('Ingresa el importe');return;}onSave({mes,importe,extra:esE?extra:'0',notas});};
  return(<>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Mes *</label><select value={mes} onChange={e=>setMes(e.target.value)} style={inp}>{MESES.map((m,i)=><option key={i} value={i}>{m}</option>)}</select></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Importe (€) *</label><input type="number" min="0" step="0.01" placeholder="Ej: 1850.00" value={importe} onChange={e=>setImporte(e.target.value)} style={inp}/></div>
    {esE&&(<div style={{background:ACCENT.amberL,borderRadius:8,padding:'10px 12px',border:'1px solid #fcd34d'}}><div style={{fontSize:12,fontWeight:700,color:ACCENT.amber,marginBottom:6}}>🎉 Mes de paga extra ({MESES[parseInt(mes)]})</div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Importe paga extra (€)</label><input type="number" min="0" step="0.01" placeholder="Ej: 1850.00" value={extra} onChange={e=>setExtra(e.target.value)} style={inp}/></div>)}
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Notas (opcional)</label><textarea rows={2} placeholder="Ej: Plus transporte..." value={notas} onChange={e=>setNotas(e.target.value)} style={{...inp,resize:'none'}}/></div>
    <div style={{display:'flex',gap:8}}><button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button><button onClick={submit} style={{flex:2,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button></div>
  </>);
}

// ─── VACACIONES ───────────────────────────────────────────────────
function VacForm({initial,tipo,festivos,onSave,onCancel,color}){
  const [fecha,setFecha]=useState(initial.fecha||'');const [dias,setDias]=useState(initial.dias?String(initial.dias):'');const [desc,setDesc]=useState(initial.desc||'');const [finCalc,setFinCalc]=useState('');const [festUsados,setFestUsados]=useState(0);
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const calcular=(f,d)=>{if(!f||!d||parseInt(d)<1){setFinCalc('');return;}const r=calcFin(f,parseInt(d),tipo,festivos);setFinCalc(r.fin);setFestUsados(r.festUsados);};
  const submit=()=>{if(!fecha){alert('Ingresa la fecha');return;}if(!dias||parseInt(dias)<1){alert('Ingresa los dias');return;}const r=calcFin(fecha,parseInt(dias),tipo,festivos);onSave({fecha,dias:parseInt(dias),fin:r.fin,desc});};
  return(<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,color:'#1e293b'}}>Registrar vacaciones</span><button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fecha inicio *</label><input type="date" value={fecha} onChange={e=>{setFecha(e.target.value);calcular(e.target.value,dias);}} style={inp}/></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Días ({tipo}) *</label><input type="number" min="1" step="1" placeholder="Ej: 5" value={dias} onChange={e=>{setDias(e.target.value);calcular(fecha,e.target.value);}} style={inp}/></div>

}

// ─── HORAS EXTRA ─────────────────────────────────────────────────

  <div style="margin-top:40px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center">Generado con Labora · labora.app</div>

// ─── INICIO ───────────────────────────────────────────────────────
function InicioSection({vacE,vacT,fallos,incid,ausencias,horas,turnos,nominas,onNav}){
  const tipo=lsLoad('vac-tipo')||'laborables';const comunidad=lsLoad('vac-comunidad')||'cataluna';
  const cobroDia=parseInt(lsLoad('cobro-dia')||'28');

  const yKey=String(CY);const totalVac=Number(vacT[yKey]??0);
  const ye=vacE.filter(e=>yearOf(e.fecha)===CY);

  const restVac=totalVac-usadosVac;const pctVac=totalVac>0?Math.min(100,(usadosVac/totalVac)*100):0;
  const now2=new Date();now2.setHours(0,0,0,0);
  const futuras=vacE.filter(e=>new Date(e.fecha+'T12:00:00')>now2).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const proxVac=futuras[0]||null;const cdVac=proxVac?weeksAndDays(proxVac.fecha):null;
  const cobro=nextCobro(cobroDia);
  const fallosMes=fallos.filter(i=>monthOf(i.fecha)===CM&&yearOf(i.fecha)===CY).length;
  const incidMes=incid.filter(i=>monthOf(i.fecha)===CM&&yearOf(i.fecha)===CY).length;
  const ausMes=ausencias.filter(i=>monthOf(i.fecha)===CM&&yearOf(i.fecha)===CY).length;
  const ausPend=ausencias.filter(i=>i.estado==='Pendiente'&&yearOf(i.fecha)===CY).length;
  const horasMes=horas.filter(i=>monthOf(i.fecha)===CM&&yearOf(i.fecha)===CY).reduce((s,i)=>s+Number(i.horas||0),0);
  // Turno: ahora viene del nuevo formato con turnosList
  const turnoActual=(()=>{
    const tl=turnos.turnosList||[];const f=turnos.frecuencia||1;const a=turnos.anclaISO||null;const ai=turnos.anclaIdx??0;const ov=turnos.overrides||{};
    const mon=getMondayOf(new Date());const k=dateToISO(mon);
    if(ov[k]!==undefined)return ov[k];
    return calcTurnoAuto(mon,tl,f,a,ai);
  })();
  const nominaMes=nominas.find(n=>n.year===CY&&n.mes===CM);
  const d=new Date();
  const diaSem=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()];
  const fechaHoy=`${diaSem}, ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}`;
  const Card=({emoji,title,onClick,children,color})=>(<div onClick={onClick} style={{background:'white',borderRadius:14,border:'1px solid #e2e8f0',padding:14,cursor:'pointer'}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}><span style={{fontSize:18}}>{emoji}</span><span style={{fontWeight:700,fontSize:14,color:'#1e293b'}}>{title}</span><span style={{marginLeft:'auto',fontSize:11,color:color||'#94a3b8',fontWeight:600}}>Ver →</span></div>{children}
  </div>);
  const cdStr=cd=>{if(!cd)return null;const parts=[];if(cd.weeks>0)parts.push(cd.weeks+' sem');if(cd.days>0)parts.push(cd.days+' día'+(cd.days!==1?'s':''));return parts.join(' y ')||'Hoy';};
  return(<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{background:'#1e293b',borderRadius:16,padding:18,color:'white'}}>
      <div style={{fontSize:12,color:'#94a3b8',marginBottom:4}}>{fechaHoy}</div>
      <div style={{fontSize:22,fontWeight:800,marginBottom:2}}>¡Hola! 👋</div>
      <div style={{fontSize:13,color:'#94a3b8'}}>Tu resumen de hoy</div>
    </div>
    {turnoActual&&(<div onClick={()=>onNav('turnos')} style={{background:tc(turnoActual).bg,borderRadius:14,border:'2px solid '+tc(turnoActual).border,padding:'12px 16px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div><div style={{fontSize:11,fontWeight:700,color:tc(turnoActual).color,textTransform:'uppercase'}}>Turno esta semana</div><div style={{fontSize:26,fontWeight:900,color:tc(turnoActual).color}}>{turnoActual}</div></div>
      <span style={{fontSize:11,color:tc(turnoActual).color,fontWeight:600}}>Ver →</span>
    </div>)}
    <Card emoji="🌴" title="Vacaciones" onClick={()=>onNav('vacaciones')} color={ACCENT.emerald}>
      {totalVac===0?(<div style={{fontSize:13,color:'#94a3b8'}}>Sin días configurados este año</div>):(<>
        <div style={{display:'flex',gap:10,marginBottom:10}}>
          <div style={{flex:1,textAlign:'center'}}><div style={{fontSize:28,fontWeight:900,color:ACCENT.amber,lineHeight:1}}>{usadosVac}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>usados</div></div>
          <div style={{width:1,background:'#f1f5f9'}}/>
          <div style={{flex:1,textAlign:'center'}}><div style={{fontSize:28,fontWeight:900,color:ACCENT.emerald,lineHeight:1}}>{restVac}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>disponibles</div></div>
          <div style={{width:1,background:'#f1f5f9'}}/>
          <div style={{flex:1,textAlign:'center'}}><div style={{fontSize:28,fontWeight:900,color:'#64748b',lineHeight:1}}>{totalVac}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>totales</div></div>
        </div>
        <div style={{height:6,background:'#f1f5f9',borderRadius:99,overflow:'hidden',marginBottom:8}}><div style={{height:'100%',width:pctVac+'%',background:ACCENT.emerald,borderRadius:99}}/></div>
        {proxVac&&cdVac&&<div style={{fontSize:12,color:ACCENT.emerald,fontWeight:600}}>🗓 Próximas en {cdStr(cdVac)} · {proxVac.desc||fmtLargo(proxVac.fecha)}</div>}
      </>)}
    </Card>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <Card emoji="💰" title="Cobro" onClick={()=>onNav('cobro')} color={ACCENT.purple}><div style={{fontSize:20,fontWeight:900,color:ACCENT.purple,lineHeight:1}}>{cobro.total===0?'¡Hoy!':cdStr({weeks:cobro.weeks,days:cobro.days})}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>para cobrar</div></Card>
      <Card emoji="💵" title="Nómina" onClick={()=>onNav('nomina')} color={ACCENT.teal}>{nominaMes?<><div style={{fontSize:20,fontWeight:900,color:ACCENT.teal}}>{Number(nominaMes.importe).toLocaleString('es-ES')}€</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>{MESES[CM]}</div></>:<div style={{fontSize:12,color:'#cbd5e1',marginTop:4}}>Sin registrar</div>}</Card>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <Card emoji="⚠️" title="Fallos" onClick={()=>onNav('fallos')} color={ACCENT.red}><div style={{fontSize:28,fontWeight:900,color:fallosMes>0?ACCENT.red:'#94a3b8',lineHeight:1}}>{fallosMes}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>este mes</div>{incidMes>0&&<div style={{fontSize:11,color:ACCENT.amber,marginTop:6,fontWeight:600}}>{incidMes} incidencia{incidMes!==1?'s':''}</div>}</Card>
      <Card emoji="🚫" title="Ausencias" onClick={()=>onNav('ausencias')} color={ausPend>0?ACCENT.amber:ACCENT.red}><div style={{fontSize:28,fontWeight:900,color:ausMes>0?ACCENT.red:'#94a3b8',lineHeight:1}}>{ausMes}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>este mes</div>{ausPend>0&&<div style={{fontSize:11,color:ACCENT.amber,marginTop:6,fontWeight:600}}>{ausPend} pendiente{ausPend!==1?'s':''}</div>}</Card>
    </div>
    <Card emoji="⏱️" title="Horas extra" onClick={()=>onNav('horas')} color={ACCENT.blue}><div style={{display:'flex',alignItems:'baseline',gap:6}}><div style={{fontSize:34,fontWeight:900,color:horasMes>0?ACCENT.blue:'#94a3b8',lineHeight:1}}>{horasMes}</div><div style={{fontSize:15,color:'#94a3b8'}}>h este mes</div></div></Card>
  </div>);
}

// ─── APP ──────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState('inicio');const [year,setYear]=useState(CY);
  const [fallos,setFallos]=useState([]);const [horas,setHoras]=useState([]);
  const [vacE,setVacE]=useState([]);const [vacT,setVacT]=useState({});
  const [incid,setIncid]=useState([]);const [ausencias,setAusencias]=useState([]);
  const [turnos,setTurnos]=useState({});const [nominas,setNominas]=useState([]);

  useEffect(()=>{
    const f=lsLoad('fallos');if(Array.isArray(f))setFallos(f);
    const h=lsLoad('horas');if(Array.isArray(h))setHoras(h);
    const vt=lsLoad('vac-t');if(vt&&typeof vt==='object')setVacT(vt);
    const i=lsLoad('incid');if(Array.isArray(i))setIncid(i);
    const a=lsLoad('ausencias');if(Array.isArray(a))setAusencias(a);
    const ve=lsLoad('vac-e');if(Array.isArray(ve))setVacE(ve);
    const t=lsLoad('turnos');if(t&&typeof t==='object')setTurnos(t);
    const n=lsLoad('nominas');if(Array.isArray(n))setNominas(n);
  },[]);

  const sf=d=>{setFallos(d);lsSave('fallos',d);};const sh=d=>{setHoras(d);lsSave('horas',d);};
  const sve=d=>{setVacE(d);lsSave('vac-e',d);};const svt=d=>{setVacT(d);lsSave('vac-t',d);};
  const si=d=>{setIncid(d);lsSave('incid',d);};const sa=d=>{setAusencias(d);lsSave('ausencias',d);};
  const st=d=>{setTurnos(d);lsSave('turnos',d);};const sn=d=>{setNominas(d);lsSave('nominas',d);};

  const ys=[];for(let y=CY+1;y>=CY-4;y--)ys.push(y);
  const showYear=['vacaciones','fallos','ausencias','horas'].includes(tab);

  const TABS=[
    {id:'inicio',label:'Inicio',emoji:'🏠'},
    {id:'vacaciones',label:'Vacac.',emoji:'🌴'},
    {id:'turnos',label:'Turnos',emoji:'🔄'},
    {id:'nomina',label:'Nómina',emoji:'💵'},
    {id:'fallos',label:'Fallos',emoji:'⚠️'},
    {id:'ausencias',label:'Ausenc.',emoji:'🚫'},
    {id:'horas',label:'H.Extra',emoji:'⏱️'},
  ];

  return(<div style={{minHeight:'100svh',display:'flex',flexDirection:'column',background:'#f8fafc',fontFamily:'system-ui,-apple-system,sans-serif'}}>
    <div style={{background:'#1e293b',color:'white',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
      <span style={{fontSize:20}}>💼</span>
      <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15}}>Labora</div><div style={{fontSize:11,color:'#94a3b8'}}>Tu gestor laboral</div></div>
      {showYear&&(<div style={{position:'relative'}}><select value={year} onChange={e=>setYear(Number(e.target.value))} style={{appearance:'none',background:'#334155',color:'white',border:'none',borderRadius:8,padding:'6px 28px 6px 10px',fontWeight:600,fontSize:14,cursor:'pointer'}}>{ys.map(y=><option key={y} value={y}>{y}</option>)}</select><span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:10}}>▾</span></div>)}
      {tab==='inicio'&&(<button onClick={()=>setTab('backup')} style={{background:'#334155',border:'none',borderRadius:8,padding:'6px 10px',color:'#94a3b8',cursor:'pointer',fontSize:16}}>💾</button>)}
    </div>
    <div style={{flex:1,overflowY:'auto',padding:16,paddingBottom:90}}>
      {tab==='inicio'&&<InicioSection vacE={vacE} vacT={vacT} fallos={fallos} incid={incid} ausencias={ausencias} horas={horas} turnos={turnos} nominas={nominas} onNav={setTab}/>}
      {tab==='vacaciones'&&<VacSection entries={vacE} totales={vacT} year={year} onUpdateE={sve} onUpdateT={svt}/>}
      {tab==='cobro'&&<CobroSection/>}
      {tab==='turnos'&&<TurnosSection turnos={turnos} onUpdate={st}/>}
      {tab==='nomina'&&<NominaSection nominas={nominas} onUpdate={sn}/>}
      {tab==='fallos'&&<FallosSection fallos={fallos} incid={incid} year={year} onUpdateF={sf} onUpdateI={si}/>}
      {tab==='ausencias'&&<AusenciasSection items={ausencias} year={year} onUpdate={sa}/>}
      {tab==='horas'&&<HorasSection items={horas} year={year} onUpdate={sh}/>}
      {tab==='backup'&&<BackupSection/>}
    </div>
    <div style={{position:'fixed',bottom:0,left:0,right:0,background:'white',borderTop:'1px solid #e2e8f0',display:'grid',gridTemplateColumns:'repeat(7,1fr)',zIndex:99}}>
      {TABS.map(({id,label,emoji})=>{const active=tab===id;return(<button key={id} onClick={()=>setTab(id)} style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'7px 2px',background:active?'#f8fafc':'white',border:'none',cursor:'pointer'}}><span style={{fontSize:18,lineHeight:1}}>{emoji}</span><span style={{fontSize:8,fontWeight:600,marginTop:2,color:active?'#1e293b':'#94a3b8',whiteSpace:'nowrap'}}>{label}</span></button>);})}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
