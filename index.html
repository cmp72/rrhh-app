<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Labora"/>
  <meta name="theme-color" content="#1e293b"/>
  <title>Labora</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
    body{margin:0;background:#f8fafc;overscroll-behavior:none}
    input,textarea,select{font-size:16px!important;font-family:inherit}
    button{font-family:inherit}
    .ms::-webkit-scrollbar{display:none}
    .ms{-ms-overflow-style:none;scrollbar-width:none}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const CY=new Date().getFullYear();
const CM=new Date().getMonth();
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MC=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DS=['L','M','X','J','V','S','D'];
const yOf=s=>parseInt(s.slice(0,4),10);
const mOf=s=>parseInt(s.slice(5,7),10)-1;
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const fmtL=s=>{const d=new Date(s+'T12:00:00');return d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear();};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isWE=d=>{const w=d.getDay();return w===0||w===6;};
const d2s=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sameD=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const monOf=d=>{const r=new Date(d);const w=r.getDay();r.setDate(r.getDate()+(w===0?-6:1-w));r.setHours(0,0,0,0);return r;};
const ll=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const ls=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

function wkDays(iso){
  const n=new Date();n.setHours(0,0,0,0);
  const t=new Date(iso+'T12:00:00');
  const df=Math.ceil((t-n)/86400000);
  if(df<=0)return null;
  return{weeks:Math.floor(df/7),days:df%7,total:df};
}
function nxtCobro(dia){
  const n=new Date();n.setHours(0,0,0,0);
  let y=n.getFullYear(),m=n.getMonth();
  let c=new Date(y,m,dia);
  if(c<=n){m++;if(m>11){m=0;y++;}c=new Date(y,m,dia);}
  const df=Math.ceil((c-n)/86400000);
  return{date:c,weeks:Math.floor(df/7),days:df%7,total:df};
}
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    mo2=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*mo2+114)/31),
    dy=((h+l-7*mo2+114)%31)+1;
  return new Date(y,mo-1,dy);
}
function festivos(year,com){
  const e=easter(year);
  const vs=new Date(e);vs.setDate(e.getDate()-2);
  const lp=new Date(e);lp.setDate(e.getDate()+1);
  const js=new Date(e);js.setDate(e.getDate()-3);
  const cL=['cataluna','c-valenciana','baleares','navarra','pais-vasco','la-rioja','murcia'];
  const f=[
    {d:new Date(year,0,1),n:'Año Nuevo'},{d:new Date(year,0,6),n:'Reyes Magos'},
    {d:vs,n:'Viernes Santo'},{d:new Date(year,4,1),n:'Día del Trabajo'},
    {d:new Date(year,9,12),n:'Fiesta Nacional'},{d:new Date(year,10,1),n:'Todos los Santos'},
    {d:new Date(year,11,6),n:'Día de la Constitución'},{d:new Date(year,11,8),n:'Inmaculada Concepción'},
    {d:new Date(year,11,25),n:'Navidad'},
  ];
  if(cL.includes(com))f.push({d:lp,n:'Lunes de Pascua'});else f.push({d:js,n:'Jueves Santo'});
  if(com==='cataluna'){f.push({d:new Date(year,5,24),n:'Sant Joan'});f.push({d:new Date(year,8,11),n:'La Diada'});f.push({d:new Date(year,11,26),n:'Sant Esteve'});}
  return f.sort((a,b)=>a.d-b.d);
}
const isFest=(d,fs)=>fs.some(f=>sameD(f.d,d));
function calcFin(ini,dias,tipo,fs){
  const c=new Date(ini+'T12:00:00');let ct=0,fu=0;
  while(true){
    const iF=isFest(c,fs),iW=isWE(c);
    if(tipo==='laborables'){if(!iF&&!iW)ct++;else if(iF)fu++;}
    else{if(!iF)ct++;else fu++;}
    if(ct>=dias)break;
    c.setDate(c.getDate()+1);
  }
  return{fin:d2s(c),fu};
}
function dUsados(e,tipo,com,hoy){
  const dias=Number(e.dias||0);if(!dias)return 0;
  const ini=new Date(e.fecha+'T12:00:00');if(ini>hoy)return 0;
  const fs=festivos(yOf(e.fecha),com);
  const c=new Date(ini);let ct=0,u=0;
  while(c<=hoy&&ct<dias){
    const iF=isFest(c,fs),iW=isWE(c);
    if(tipo==='laborables'){if(!iF&&!iW){ct++;u++;}}
    else{if(!iF){ct++;u++;}}
    c.setDate(c.getDate()+1);
  }
  return u;
}

const A={red:'#dc2626',redL:'#fee2e2',blue:'#2563eb',blueL:'#dbeafe',
  em:'#059669',emL:'#d1fae5',amb:'#d97706',ambL:'#fef3c7',
  pur:'#7c3aed',purL:'#ede9fe',teal:'#0d9488',tealL:'#ccfbf1'};
const TC={'Mañana':{bg:'#fef3c7',c:'#92400e',b:'#fcd34d'},'Tarde':{bg:'#dbeafe',c:'#1e3a8a',b:'#93c5fd'},'Noche':{bg:'#ede9fe',c:'#4c1d95',b:'#c4b5fd'}};
const tc=t=>TC[t]||{bg:'#f0fdf4',c:'#065f46',b:'#6ee7b7'};
const ME=[5,11];

// ── UI ──
function Stat({label,value,unit,color}){return <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:'10px 12px',flex:1,minWidth:0}}><div style={{fontSize:10,textTransform:'uppercase',color:'#94a3b8',fontWeight:600}}>{label}</div><div style={{fontSize:26,fontWeight:800,color,marginTop:2,lineHeight:1}}>{value}</div><div style={{fontSize:11,color:'#94a3b8',marginTop:2}}>{unit}</div></div>;}
function SHead({emoji,title,sub,bg}){return <div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:40,height:40,borderRadius:12,background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{emoji}</div><div><div style={{fontWeight:800,fontSize:16,color:'#1e293b'}}>{title}</div><div style={{fontSize:11,color:'#94a3b8'}}>{sub}</div></div></div>;}
function AddBtn({label,color,onClick}){return <button onClick={onClick} style={{width:'100%',background:color,color:'white',border:'none',borderRadius:12,padding:'13px 0',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontWeight:600,fontSize:15,cursor:'pointer'}}><span style={{fontSize:20,lineHeight:1}}>+</span>{label}</button>;}
function IcoEdit(){return <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>;}
function IcoTrash(){return <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>;}
function IcoX({s=18}){return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;}
function IcoChk(){return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;}
function Empty({text}){return <div style={{background:'white',borderRadius:12,border:'2px dashed #cbd5e1',padding:32,textAlign:'center',color:'#94a3b8',fontSize:14}}>{text}</div>;}

function Item({item,onEdit,onDelete,children}){
  const [conf,setConf]=useState(false);
  return <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:12,display:'flex',gap:8}}>
    <div style={{flex:1,minWidth:0}}>{children}</div>
    <div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
      {!conf?<><button onClick={()=>onEdit(item)} style={{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}}><IcoEdit/></button><button onClick={()=>setConf(true)} style={{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}}><IcoTrash/></button></>
      :<><button onClick={()=>{onDelete(item.id);setConf(false);}} style={{padding:'6px 8px',background:'#dc2626',border:'none',borderRadius:8,cursor:'pointer',color:'white',fontWeight:800,fontSize:11}}>OK</button><button onClick={()=>setConf(false)} style={{padding:6,background:'#f1f5f9',border:'none',borderRadius:8,cursor:'pointer',color:'#64748b'}}><IcoX s={14}/></button></>}
    </div>
  </div>;
}

function FiltroMes({year,items,mes,onMes,color}){
  const ref=useRef(null);
  const con=new Set(items.filter(i=>yOf(i.fecha)===year).map(i=>mOf(i.fecha)));
  useEffect(()=>{if(ref.current&&mes!==null){const b=ref.current.querySelector(`[data-m="${mes}"]`);if(b)b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}}, [mes]);
  return <div ref={ref} className="ms" style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:4}}>
    <button onClick={()=>onMes(null)} style={{flexShrink:0,padding:'6px 14px',borderRadius:20,border:'1px solid '+(mes===null?color:'#e2e8f0'),background:mes===null?color:'white',color:mes===null?'white':'#64748b',fontWeight:600,fontSize:12,cursor:'pointer'}}>Todos</button>
    {MC.map((m,i)=>{const a=mes===i,t=con.has(i);return <button key={i} data-m={i} onClick={()=>onMes(a?null:i)} style={{flexShrink:0,padding:'6px 12px',borderRadius:20,border:'1px solid '+(a?color:t?'#e2e8f0':'#f1f5f9'),background:a?color:'white',color:a?'white':t?'#475569':'#cbd5e1',fontWeight:a||t?600:400,fontSize:12,cursor:'pointer',opacity:t||a?1:0.5}}>{m}</button>;})}
  </div>;
}

function Form({title,fields,initial,onSave,onCancel,color}){
  const [d,setD]=useState({...initial});
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const sub=()=>{for(const f of fields)if(f.req&&!String(d[f.name]||'').trim()){alert('Completa: '+f.label);return;}onSave(d);};
  return <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,color:'#1e293b'}}>{title}</span><button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IcoX/></button></div>
    {fields.map(f=><div key={f.name}><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>{f.label}{f.req&&<span style={{color:'#ef4444'}}> *</span>}</label>
      {f.type==='textarea'?<textarea rows={3} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={{...inp,resize:'none'}}/>
      :<input type={f.type||'text'} step={f.step} min={f.min} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={inp}/>}
    </div>)}
    <div style={{display:'flex',gap:8}}><button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button><button onClick={sub} style={{flex:1,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button></div>
  </div>;
}

function FotoV({src,onClose}){return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}><img src={src} style={{maxWidth:'100%',maxHeight:'90vh',borderRadius:8,objectFit:'contain'}}/><button onClick={onClose} style={{position:'absolute',top:16,right:16,background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:36,height:36,color:'white',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>x</button></div>;}

function FotosPicker({fotos,onChange}){
  const [v,setV]=useState(null);
  const add=e=>{const fs=Array.from(e.target.files).slice(0,3-fotos.length);fs.forEach(f=>{const r=new FileReader();r.onload=ev=>onChange([...fotos,ev.target.result]);r.readAsDataURL(f);});e.target.value='';};
  return <div>{v&&<FotoV src={v} onClose={()=>setV(null)}/>}<div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}>{fotos.map((f,i)=><div key={i} style={{position:'relative'}}><img src={f} onClick={()=>setV(f)} style={{width:72,height:72,borderRadius:8,objectFit:'cover',border:'1px solid #e2e8f0',cursor:'pointer'}}/><button onClick={()=>onChange(fotos.filter((_,fi)=>fi!==i))} style={{position:'absolute',top:-6,right:-6,width:18,height:18,borderRadius:'50%',background:'#dc2626',border:'none',color:'white',fontSize:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>x</button></div>)}{fotos.length<3&&<label style={{width:72,height:72,borderRadius:8,border:'2px dashed #cbd5e1',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:24,color:'#94a3b8',background:'#f8fafc'}}>+<input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={add}/></label>}</div></div>;
}

function IncidForm({initial,onSave,onCancel,color}){
  const [d,setD]=useState({...initial});const [fotos,setFotos]=useState(initial.fotos||[]);
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const sub=()=>{if(!d.fecha){alert('Fecha requerida');return;}if(!String(d.titulo||'').trim()){alert('Título requerido');return;}if(!String(d.desc||'').trim()){alert('Descripción requerida');return;}onSave({...d,fotos});};
  return <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,color:'#1e293b'}}>{initial.id?'Editar':'Nueva incidencia'}</span><button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IcoX/></button></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fecha *</label><input type="date" value={d.fecha||''} onChange={e=>setD({...d,fecha:e.target.value})} style={inp}/></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Título *</label><input type="text" value={d.titulo||''} onChange={e=>setD({...d,titulo:e.target.value})} style={inp}/></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Descripción *</label><textarea rows={3} value={d.desc||''} onChange={e=>setD({...d,desc:e.target.value})} style={{...inp,resize:'none'}}/></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fotos (máx. 3)</label><FotosPicker fotos={fotos} onChange={setFotos}/></div>
    <div style={{display:'flex',gap:8}}><button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button><button onClick={sub} style={{flex:2,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button></div>
  </div>;
}

function IncidItem({it,onEdit,onDelete}){
  const [v,setV]=useState(null);
  return <Item item={it} onEdit={onEdit} onDelete={onDelete}>{v&&<FotoV src={v} onClose={()=>setV(null)}/>}<div style={{fontSize:12,color:'#94a3b8'}}>{fmt(it.fecha)}</div>{it.titulo&&<div style={{fontSize:14,fontWeight:700,color:'#1e293b',marginTop:3}}>{it.titulo}</div>}<div style={{fontSize:13,color:'#475569',marginTop:3,wordBreak:'break-word'}}>{it.desc}</div>{it.fotos&&it.fotos.length>0&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>{it.fotos.map((f,i)=><img key={i} src={f} onClick={()=>setV(f)} style={{width:60,height:60,borderRadius:6,objectFit:'cover',border:'1px solid #e2e8f0',cursor:'pointer'}}/>)}</div>}</Item>;
}

// ── INFORME ──
function generarInforme(year){
  const fals=(ll('fallos')||[]).filter(i=>yOf(i.fecha)===year);
  const hrs=(ll('horas')||[]).filter(i=>yOf(i.fecha)===year);
  const vac=(ll('vac-e')||[]).filter(i=>yOf(i.fecha)===year);
  const vacT=ll('vac-t')||{};
  const inc=(ll('incid')||[]).filter(i=>yOf(i.fecha)===year);
  const aus=(ll('ausencias')||[]).filter(i=>yOf(i.fecha)===year);
  const nom=(ll('nominas')||[]).filter(n=>n.year===year);
  const tipo=ll('vac-tipo')||'laborables';
  const com=ll('vac-comunidad')||'cataluna';
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const totalD=Number(vacT[String(year)]??0);
  const usVac=vac.reduce((a,e)=>a+dUsados(e,tipo,com,hoy),0);
  const totHrs=hrs.reduce((s,i)=>s+Number(i.horas||0),0);
  const totNom=nom.reduce((s,n)=>s+Number(n.importe||0)+(ME.includes(n.mes)?Number(n.extra||0):0),0);
  const fD=s=>new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const tbl=(titulo,rows)=>rows.length===0?'':(`<h2>${titulo}</h2><table><thead><tr>${Object.keys(rows[0]).map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Object.values(r).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`);

 class="cu">${nom.length} meses</div></div>`:''}</div>${tbl('🌴 Vacaciones',[...vac].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(e=>({'Inicio':fD(e.fecha),'Fin':e.fin?fD(e.fin):'-','Días':e.dias,'Nota':e.desc||'-'})))}${tbl('💵 Nóminas',[...nom].sort((a,b)=>a.mes-b.mes).map(n=>({'Mes':MESES[n.mes],'Nómina':Number(n.importe).toLocaleString('es-ES')+'€','Extra':ME.includes(n.mes)&&n.extra>0?Number(n.extra).toLocaleString('es-ES')+'€':'-','Total':(Number(n.importe)+(ME.includes(n.mes)?Number(n.extra||0):0)).toLocaleString('es-ES')+'€','Notas':n.notas||'-'})))}${tbl('⏱️ Horas extra',[...hrs].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(h=>({'Fecha':fD(h.fecha),'Horas':h.horas,'Nota':h.desc||'-'})))}${tbl('🚫 Ausencias',[...aus].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(a=>({'Fecha':fD(a.fecha),'Tipo':a.just,'Motivo':a.motivo||'-','Horas':a.horas>0?a.horas+'h':'Día completo','Estado':a.estado})))}${tbl('⚠️ Fallos',[...fals].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(f=>({'Fecha':fD(f.fecha),'Descripción':f.desc})))}${tbl('⚠️ Incidencias',[...inc].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(i=>({'Fecha':fD(i.fecha),'Título':i.titulo,'Descripción':i.desc})))}<footer>Generado con Labora</footer></body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w)w.onload=()=>setTimeout(()=>w.print(),500);
  setTimeout(()=>URL.revokeObjectURL(url),15000);
}

// ── AVISOS ──
function Avisos({vacE,turnos}){
  const avisos=[];
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const en7=new Date(hoy);en7.setDate(hoy.getDate()+7);

  // Vacaciones próximas
  const proxVac=vacE.filter(e=>{const f=new Date(e.fecha+'T12:00:00');return f>hoy&&f<=en7;}).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(proxVac.length>0){
    const v=proxVac[0];const dias=Math.ceil((new Date(v.fecha+'T12:00:00')-hoy)/86400000);
    avisos.push({emoji:'🌴',texto:`Tus vacaciones empiezan en ${dias} día${dias!==1?'s':''}`,color:'#065f46',bg:A.emL,border:'#6ee7b7'});
  }

  // Cambio de turno la semana que viene
  if(turnos.turnosList&&turnos.turnosList.length>=2&&turnos.anclaISO){
    const monActual=monOf(hoy);
    const monSig=new Date(monActual);monSig.setDate(monActual.getDate()+7);
    const tActual=cTurno(monActual,turnos.turnosList,turnos.frecuencia||1,turnos.anclaISO,turnos.anclaIdx??0);
    const tSig=cTurno(monSig,turnos.turnosList,turnos.frecuencia||1,turnos.anclaISO,turnos.anclaIdx??0);
    if(tActual&&tSig&&tActual!==tSig){
      avisos.push({emoji:'🔄',texto:`La semana que viene cambias a turno de ${tSig}`,color:'#92400e',bg:A.ambL,border:'#fcd34d'});
    }
  }

  if(avisos.length===0)return null;
  return <div style={{display:'flex',flexDirection:'column',gap:8}}>
    {avisos.map((a,i)=><div key={i} style={{background:a.bg,border:'1px solid '+a.border,borderRadius:12,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
      <span style={{fontSize:20,flexShrink:0}}>{a.emoji}</span>
      <span style={{fontSize:13,fontWeight:600,color:a.color}}>{a.texto}</span>
    </div>)}
  </div>;
}
function cTurno(mon,list,frec,ancla,idx){
  if(!list||!list.length||!ancla)return null;
  const am=monOf(new Date(ancla+'T12:00:00'));
  const dif=Math.round((monOf(mon)-am)/(7*86400000));
  const bl=Math.floor(dif/frec);
  return list[((idx+bl)%list.length+list.length)%list.length];
}

        {PRESETS.map((p,i)=>{const sel=pIdx===i;return <button key={i} onClick={()=>onUpdate({...cfg,turnosList:p.t,anclaIdx:0,overrides:{}})} style={{width:'100%',padding:'14px 16px',borderRadius:12,border:'2px solid '+(sel?A.amb:'#e2e8f0'),background:sel?'#fffbeb':'white',textAlign:'left',cursor:'pointer',fontWeight:700,fontSize:15,color:sel?A.amb:'#475569',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}><span>{p.label}</span>{sel&&<span>✓</span>}</button>;})}
      </div>
      {list.length>=2&&<div>

        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{FREQS.map(f=><button key={f.v} onClick={()=>onUpdate({...cfg,frecuencia:f.v,overrides:{}})} style={{padding:'10px 14px',borderRadius:20,border:'2px solid '+(frec===f.v?A.amb:'#e2e8f0'),background:frec===f.v?'#fffbeb':'white',cursor:'pointer',fontWeight:600,fontSize:13,color:frec===f.v?A.amb:'#475569'}}>{f.l}</button>)}</div>

function NominaSection({nominas,onUpdate}){
  const [year,setYear]=useState(CY);const [form,setForm]=useState(false);const [ed,setEd]=useState(null);
  const yn=nominas.filter(n=>n.year===year);
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const tot=yn.reduce((s,n)=>s+Number(n.importe||0)+(ME.includes(n.mes)?Number(n.extra||0):0),0);
  const med=yn.length>0?(tot/yn.length).toFixed(0):0;
  const gD=m=>{const a=yn.find(n=>n.mes===m);const b=yn.find(n=>n.mes===m-1);if(!a||!b)return null;return Number(a.importe)-Number(b.importe);};
  const gN=m=>yn.find(n=>n.mes===m)||null;
  const save=data=>{
    const it={...data,year,mes:parseInt(data.mes),importe:parseFloat(data.importe)||0,extra:parseFloat(data.extra||0)||0};
    if(ed){onUpdate(nominas.map(n=>n.id===ed.id?{...it,id:ed.id}:n));setEd(null);}
    else{const ex=nominas.find(n=>n.year===year&&n.mes===parseInt(data.mes));if(ex)onUpdate(nominas.map(n=>n.id===ex.id?{...it,id:ex.id}:n));else onUpdate([...nominas,{...it,id:uid()}]);setForm(false);}
  };
  const ys=[];for(let y=CY+1;y>=CY-4;y--)ys.push(y);
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <SHead emoji="💵" title="Nómina" sub="Historial de cobros" bg={A.tealL}/>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:'12px 16px'}}><span style={{fontWeight:700,color:'#1e293b'}}>Año</span><select value={year} onChange={e=>setYear(Number(e.target.value))} style={{appearance:'none',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:8,padding:'6px 12px',fontWeight:600,fontSize:14,cursor:'pointer',color:'#1e293b'}}>{ys.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
    {yn.length>0&&<div style={{display:'flex',gap:10}}><Stat label="Total año" value={tot.toLocaleString('es-ES')+'€'} unit={yn.length+' nóminas'} color={A.teal}/><Stat label="Media" value={Number(med).toLocaleString('es-ES')+'€'} unit="por mes" color={A.teal}/></div>}
    <AddBtn label="Registrar nómina" color={A.teal} onClick={()=>{setEd(null);setForm(true);}}/>
    {(form||ed)&&<div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,color:'#1e293b'}}>{ed?'Editar':'Nueva nómina'}</span><button onClick={()=>{setForm(false);setEd(null);}} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IcoX/></button></div>
      <NomForm initial={ed||{mes:String(CM),importe:'',extra:'',notas:''}} onSave={save} onCancel={()=>{setForm(false);setEd(null);}} color={A.teal} inp={inp}/>
    </div>}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8}}>{MESES.map((m,i)=>{
      const nom=gN(i);const df=gD(i);const esE=ME.includes(i);const esA=i===CM&&year===CY;
      return <div key={i} onClick={()=>{if(nom){setEd(nom);setForm(false);}else{setEd(null);setForm(true);}}} style={{background:nom?'white':'#f8fafc',borderRadius:12,border:'2px solid '+(esA?A.teal:nom?'#e2e8f0':'#f1f5f9'),padding:12,cursor:'pointer',position:'relative'}}>
        {esE&&<div style={{position:'absolute',top:6,right:8,fontSize:9,fontWeight:700,color:A.amb}}>+Extra</div>}
        <div style={{fontSize:11,fontWeight:700,color:esA?A.teal:'#94a3b8',marginBottom:4}}>{MC[i]}</div>
        {nom?<><div style={{fontSize:18,fontWeight:800,color:'#1e293b'}}>{Number(nom.importe).toLocaleString('es-ES')}€</div>{esE&&nom.extra>0&&<div style={{fontSize:11,color:A.amb,fontWeight:600}}>+{Number(nom.extra).toLocaleString('es-ES')}€</div>}{df!==null&&<div style={{fontSize:11,marginTop:2,fontWeight:600,color:df>0?A.em:df<0?A.red:'#94a3b8'}}>{df>0?'▲':'▼'} {Math.abs(df).toLocaleString('es-ES')}€</div>}</>
        :<div style={{fontSize:12,color:'#cbd5e1',marginTop:4}}>Toca para añadir</div>}
      </div>;
    })}</div>
    {yn.length>0&&<div style={{display:'flex',flexDirection:'column',gap:8}}><div style={{fontSize:12,fontWeight:700,color:'#94a3b8',textTransform:'uppercase'}}>Detalle</div>
      {[...yn].sort((a,b)=>b.mes-a.mes).map(n=>{const df=gD(n.mes);const esE=ME.includes(n.mes);const tot2=Number(n.importe)+(esE?Number(n.extra||0):0);return <Item key={n.id} item={n} onEdit={i=>{setEd(i);setForm(false);}} onDelete={id=>onUpdate(nominas.filter(x=>x.id!==id))}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}><div><div style={{fontSize:13,fontWeight:700,color:'#1e293b'}}>{MESES[n.mes]} {year}</div>{esE&&n.extra>0&&<div style={{fontSize:11,color:A.amb}}>+ paga extra</div>}</div><div style={{textAlign:'right'}}><div style={{fontSize:18,fontWeight:800,color:A.teal}}>{tot2.toLocaleString('es-ES')}€</div>{df!==null&&<div style={{fontSize:11,fontWeight:600,color:df>0?A.em:df<0?A.red:'#94a3b8'}}>{df>0?'▲ +':'▼ '}{df.toLocaleString('es-ES')}€</div>}</div></div>
        {n.notas&&<div style={{fontSize:12,color:'#64748b',marginTop:4}}>{n.notas}</div>}
      </Item>;})}
    </div>}
    {yn.length===0&&<Empty text="Sin nóminas este año"/>}
  </div>;
}
function NomForm({initial,onSave,onCancel,color,inp}){
  const [mes,setMes]=useState(String(initial.mes||CM));const [imp,setImp]=useState(String(initial.importe||''));const [ext,setExt]=useState(String(initial.extra||''));const [not,setNot]=useState(initial.notas||'');
  const esE=ME.includes(parseInt(mes));
  const sub=()=>{if(!imp||parseFloat(imp)<0){alert('Ingresa el importe');return;}onSave({mes,importe:imp,extra:esE?ext:'0',notas:not});};
  return <>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Mes *</label><select value={mes} onChange={e=>setMes(e.target.value)} style={inp}>{MESES.map((m,i)=><option key={i} value={i}>{m}</option>)}</select></div>
    <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Importe (€) *</label><input type="number" min="0" step="0.01" placeholder="1850.00" value={imp} onChange={e=>setImp(e.target.value)} style={inp}/></div>

function Calendario({entries,fests,cy,cm,onCh,tipo,com}){
  const vacD=new Set();
  entries.forEach(e=>{
    if(!e.dias||Number(e.dias)<1)return;
    const fs=festivos(yOf(e.fecha),com);const r=calcFin(e.fecha,Number(e.dias),tipo,fs);
    const c=new Date(e.fecha+'T12:00:00');const fin=new Date(r.fin+'T12:00:00');
    while(c<=fin){const iF=isFest(c,fs),iW=isWE(c);if(tipo==='laborables'?(!iF&&!iW):(!iF))vacD.add(d2s(c));c.setDate(c.getDate()+1);}
  });
  const ts=todayISO();const f1=new Date(cy,cm,1);const sd=(f1.getDay()+6)%7;const dim=new Date(cy,cm+1,0).getDate();
  const fm=fests.filter(f=>f.d.getMonth()===cm&&f.d.getFullYear()===cy);
  return <div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <span style={{fontWeight:700,fontSize:15,color:'#1e293b'}}>{MESES[cm]} {cy}</span>
      <div style={{display:'flex',gap:8}}><button onClick={()=>onCh(-1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8249;</button><button onClick={()=>onCh(1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8250;</button></div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:8}}>
      {DS.map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:'#94a3b8',padding:'4px 0'}}>{d}</div>)}
      {Array(sd).fill(null).map((_,i)=><div key={'e'+i}/>)}
      {Array(dim).fill(null).map((_,i)=>{
        const d=i+1,dt=new Date(cy,cm,d),ds=d2s(dt);
        const iF=isFest(dt,fests),iV=vacD.has(ds),iT=ds===ts,iW=isWE(dt);
        let bg='transparent',col=iW?'#94a3b8':'#1e293b',fw='normal';
        if(iT){bg='#1e293b';col='white';fw='700';}else if(iF){bg='#dbeafe';col='#2563eb';fw='700';}else if(iV){bg='#d1fae5';col='#065f46';}
        return <div key={d} style={{textAlign:'center',padding:'5px 1px',borderRadius:6,fontSize:12,background:bg,color:col,fontWeight:fw,minHeight:28,display:'flex',alignItems:'center',justifyContent:'center'}}>{d}</div>;
      })}
    </div>
    <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
      <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#2563eb'}}/> Festivo</div>
      <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#059669'}}/> Vacaciones</div>

    </div>

        if(Array.isArray(data.vacE))ls('vac-e',data.vacE);if(data.vacT)ls('vac-t',data.vacT);
        if(Array.isArray(data.incid))ls('incid',data.incid);if(Array.isArray(data.ausencias))ls('ausencias',data.ausencias);
        if(data.cobroDia)ls('cobro-dia',data.cobroDia);if(data.vacTipo)ls('vac-tipo',data.vacTipo);
        if(data.vacComunidad)ls('vac-comunidad',data.vacComunidad);

        <select value={yInf} onChange={e=>setYInf(Number(e.target.value))} style={{flex:1,padding:'11px 12px',border:'1px solid #e2e8f0',borderRadius:8,fontSize:15,fontWeight:700,color:'#1e293b',background:'#f8fafc'}}>{ys.map(y=><option key={y} value={y}>{y}</option>)}</select>
        <button onClick={()=>generarInforme(yInf)} style={{flex:2,background:A.teal,color:'white',border:'none',borderRadius:10,padding:'11px 0',fontWeight:700,fontSize:15,cursor:'pointer'}}>📄 Ver informe {yInf}</button>

    </div>

    <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:10}}>
      <div style={{fontSize:13,fontWeight:600,color:'#1e293b'}}>Restaurar datos</div>
      <div style={{fontSize:12,color:'#64748b'}}>Los datos actuales serán reemplazados.</div>
      <label style={{width:'100%',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'13px 0',fontWeight:600,fontSize:15,cursor:'pointer',textAlign:'center',color:A.blue,display:'block'}}>Seleccionar archivo<input type="file" accept=".json" style={{display:'none'}} onChange={imp}/></label>

      <div style={{fontSize:13,fontWeight:700,color:'#1e293b'}}>☕ Apoya Labora</div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
      <Card emoji="💰" title="Cobro" onClick={()=>onNav('cobro')} color={A.pur}><div style={{fontSize:20,fontWeight:900,color:A.pur,lineHeight:1}}>{cobro.total===0?'¡Hoy!':cdStr({weeks:cobro.weeks,days:cobro.days})}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>para cobrar</div></Card>
      <Card emoji="💵" title="Nómina" onClick={()=>onNav('nomina')} color={A.teal}>{nomM?<><div style={{fontSize:20,fontWeight:900,color:A.teal}}>{Number(nomM.importe).toLocaleString('es-ES')}€</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>{MESES[CM]}</div></>:<div style={{fontSize:12,color:'#cbd5e1',marginTop:4}}>Sin registrar</div>}</Card>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
      <Card emoji="⚠️" title="Fallos" onClick={()=>onNav('fallos')} color={A.red}><div style={{fontSize:28,fontWeight:900,color:fM>0?A.red:'#94a3b8',lineHeight:1}}>{fM}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>este mes</div>{iM>0&&<div style={{fontSize:11,color:A.amb,marginTop:6,fontWeight:600}}>{iM} incidencia{iM!==1?'s':''}</div>}</Card>
      <Card emoji="🚫" title="Ausencias" onClick={()=>onNav('ausencias')} color={aP>0?A.amb:A.red}><div style={{fontSize:28,fontWeight:900,color:aM>0?A.red:'#94a3b8',lineHeight:1}}>{aM}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>este mes</div>{aP>0&&<div style={{fontSize:11,color:A.amb,marginTop:6,fontWeight:600}}>{aP} pendiente{aP!==1?'s':''}</div>}</Card>
    </div>
    <Card emoji="⏱️" title="Horas extra" onClick={()=>onNav('horas')} color={A.blue}><div style={{display:'flex',alignItems:'baseline',gap:6}}><div style={{fontSize:34,fontWeight:900,color:hM>0?A.blue:'#94a3b8',lineHeight:1}}>{hM}</div><div style={{fontSize:15,color:'#94a3b8'}}>h este mes</div></div></Card>

    {/* Ko-fi */}
    <div style={{background:'linear-gradient(135deg,#fff5f0,#fff0eb)',borderRadius:14,border:'1px solid #fcd34d',padding:16,display:'flex',alignItems:'center',gap:12}}>
      <span style={{fontSize:32,flexShrink:0}}>☕</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:700,fontSize:14,color:'#1e293b',marginBottom:2}}>¿Te es útil Labora?</div>
        <div style={{fontSize:12,color:'#64748b'}}>Es gratis y sin anuncios. Si quieres apoyar el proyecto, invítame a un café 🙏</div>
      </div>
      <button onClick={()=>window.open('https://ko-fi.com/laboraapp','_blank')} style={{flexShrink:0,background:'#FF5E5B',color:'white',border:'none',borderRadius:10,padding:'10px 14px',fontWeight:700,fontSize:13,cursor:'pointer'}}>
        Apoyar
      </button>
    </div>
  </div>;
}

// ── DISCLAIMER ──
function DisclaimerModal({onAcepto}){
  const [scroll,setScroll]=useState(false);
  const ref=useRef(null);
  const onScroll=()=>{const el=ref.current;if(!el)return;if(el.scrollTop+el.clientHeight>=el.scrollHeight-20)setScroll(true);};
  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:999,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
    <div style={{background:'white',borderRadius:'20px 20px 0 0',width:'100%',maxWidth:500,maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'20px 20px 0',flexShrink:0}}>
        <div style={{width:40,height:4,background:'#e2e8f0',borderRadius:99,margin:'0 auto 16px'}}/>
        <div style={{fontSize:18,fontWeight:800,color:'#1e293b',marginBottom:4}}>⚖️ Aviso legal importante</div>
        <div style={{fontSize:12,color:'#94a3b8',marginBottom:12}}>Lee esto antes de usar Labora · desplázate hasta el final para aceptar</div>
      </div>
      <div ref={ref} onScroll={onScroll} style={{overflowY:'auto',padding:'0 20px',flex:1}}>
        <div style={{fontSize:13,color:'#475569',lineHeight:1.7,display:'flex',flexDirection:'column',gap:14}}>
          <div style={{background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:10,padding:12}}>
            <div style={{fontWeight:700,color:'#92400e',marginBottom:4}}>⚠️ Herramienta de apoyo, no asesoramiento legal</div>
            <div>Labora es una aplicación de registro personal. Los cálculos que realiza (vacaciones, festivos, horas extra, etc.) son orientativos y pueden no coincidir con tu convenio colectivo, contrato o legislación aplicable.</div>
          </div>
          <div><div style={{fontWeight:700,color:'#1e293b',marginBottom:4}}>📋 Qué es Labora</div>Labora es una herramienta digital para que los trabajadores puedan llevar un registro personal de su vida laboral: vacaciones, turnos, nóminas, ausencias y horas extra. No es un sistema oficial de control de presencia ni está vinculado a ningún sistema de RRHH de ninguna empresa.</div>
          <div><div style={{fontWeight:700,color:'#1e293b',marginBottom:4}}>🚫 Qué NO es Labora</div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              <div>• <strong>No es asesoramiento jurídico ni laboral.</strong> Si tienes dudas sobre tus derechos, consulta a un abogado laboralista o a tu sindicato.</div>
              <div>• <strong>No garantiza exactitud legal.</strong> Los festivos, convenios y normativas varían por comunidad, sector y empresa. Verifica siempre con tu convenio colectivo.</div>
              <div>• <strong>No reemplaza la documentación oficial</strong> de tu empresa (nóminas, contratos, partes de trabajo).</div>
              <div>• <strong>No es válida como prueba legal</strong> en procedimientos judiciales o administrativos por sí sola.</div>
            </div>
          </div>
          <div><div style={{fontWeight:700,color:'#1e293b',marginBottom:4}}>🔒 Tus datos y privacidad</div>Todos tus datos se almacenan <strong>únicamente en tu dispositivo</strong>. Labora no envía ningún dato a servidores externos, no tiene acceso a tu información y no comparte nada con terceros. Si desinstales la app o limpias el caché, los datos se pierden. Por eso existe la función de backup.</div>
          <div><div style={{fontWeight:700,color:'#1e293b',marginBottom:4}}>⚖️ Limitación de responsabilidad</div>El desarrollador de Labora no se hace responsable de decisiones laborales, económicas o legales tomadas basándose en los datos o cálculos de la app. El uso de Labora es responsabilidad exclusiva del usuario.</div>
          <div><div style={{fontWeight:700,color:'#1e293b',marginBottom:4}}>📅 Festivos y convenios</div>Los festivos nacionales y autonómicos se calculan de forma automática pero pueden no estar actualizados o pueden variar. Comprueba siempre el calendario oficial de tu comunidad y tu convenio colectivo.</div>
          <div style={{background:'#f0fdf4',border:'1px solid #6ee7b7',borderRadius:10,padding:12,marginBottom:8}}>
            <div style={{fontWeight:700,color:'#065f46',marginBottom:4}}>✅ Al aceptar, confirmas que</div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <div>• Has leído y entendido este aviso legal.</div>
              <div>• Usarás Labora como herramienta de apoyo personal.</div>
              <div>• Verificarás cualquier dato importante con las fuentes oficiales.</div>
              <div>• Entiendes que el desarrollador no tiene responsabilidad sobre el uso que hagas de la app.</div>
            </div>
          </div>
        </div>
      </div>
      <div style={{padding:20,flexShrink:0,borderTop:'1px solid #f1f5f9'}}>
        {!scroll&&<div style={{fontSize:11,color:'#94a3b8',textAlign:'center',marginBottom:10}}>↓ Desplázate hasta el final para aceptar</div>}
        <button onClick={scroll?onAcepto:null} style={{width:'100%',background:scroll?A.em:'#e2e8f0',color:scroll?'white':'#94a3b8',border:'none',borderRadius:12,padding:'14px 0',fontWeight:700,fontSize:15,cursor:scroll?'pointer':'not-allowed',transition:'all 0.3s'}}>
          {scroll?'✓ Entendido, empezar a usar Labora':'Lee el aviso para continuar'}
        </button>
      </div>
    </div>
  </div>;
}

function DisclaimerInfo(){
  const [open,setOpen]=useState(false);
  return <>
    {open&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:998,display:'flex',alignItems:'flex-end'}} onClick={()=>setOpen(false)}>
      <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'20px 20px 0 0',width:'100%',maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'20px 20px 0',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{fontSize:16,fontWeight:800,color:'#1e293b'}}>⚖️ Aviso legal</div>
          <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8'}}><IcoX/></button>
        </div>
        <div style={{overflowY:'auto',padding:'12px 20px 24px',fontSize:13,color:'#475569',lineHeight:1.7,display:'flex',flexDirection:'column',gap:12}}>
          <div style={{background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:10,padding:12}}><div style={{fontWeight:700,color:'#92400e',marginBottom:4}}>⚠️ Herramienta de apoyo, no asesoramiento legal</div>Los cálculos son orientativos. Verifica siempre con tu convenio colectivo y fuentes oficiales.</div>
          <div>Labora almacena todos los datos <strong>solo en tu dispositivo</strong>. No envía nada a servidores externos.</div>
          <div>El desarrollador no se hace responsable de decisiones tomadas basándose en los datos de la app.</div>
          <div style={{fontSize:11,color:'#94a3b8'}}>Versión del aviso: 1.0 · {new Date().getFullYear()}</div>
        </div>
      </div>
    </div>}
    <button onClick={()=>setOpen(true)} style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'#94a3b8',textDecoration:'underline',padding:0}}>⚖️ Aviso legal</button>
  </>;
}

// ── APP ──
function App(){
  const [tab,setTab]=useState('inicio');const [year,setYear]=useState(CY);
  const [disclaimerOk,setDisclaimerOk]=useState(()=>{const v=ll('disclaimer-ok');return v===true;});
  const [fallos,setFallos]=useState([]);const [horas,setHoras]=useState([]);
  const [vacE,setVacE]=useState([]);const [vacT,setVacT]=useState({});
  const [incid,setIncid]=useState([]);const [aus,setAus]=useState([]);
  const [turnos,setTurnos]=useState({});const [nominas,setNominas]=useState([]);

  useEffect(()=>{
    const f=ll('fallos');if(Array.isArray(f))setFallos(f);
    const h=ll('horas');if(Array.isArray(h))setHoras(h);
    const vt=ll('vac-t');if(vt&&typeof vt==='object')setVacT(vt);
    const i=ll('incid');if(Array.isArray(i))setIncid(i);
    const a=ll('ausencias');if(Array.isArray(a))setAus(a);
    const ve=ll('vac-e');if(Array.isArray(ve))setVacE(ve);
    const t=ll('turnos');if(t&&typeof t==='object')setTurnos(t);
    const n=ll('nominas');if(Array.isArray(n))setNominas(n);
  },[]);

  const sF=d=>{setFallos(d);ls('fallos',d);};const sH=d=>{setHoras(d);ls('horas',d);};
  const sVe=d=>{setVacE(d);ls('vac-e',d);};const sVt=d=>{setVacT(d);ls('vac-t',d);};
  const sI=d=>{setIncid(d);ls('incid',d);};const sA=d=>{setAus(d);ls('ausencias',d);};
  const sT=d=>{setTurnos(d);ls('turnos',d);};const sN=d=>{setNominas(d);ls('nominas',d);};

  const ys=[];for(let y=CY+1;y>=CY-4;y--)ys.push(y);
  const showY=['vacaciones','fallos','ausencias','horas'].includes(tab);

  const TABS=[
    {id:'inicio',label:'Inicio',emoji:'🏠'},{id:'vacaciones',label:'Vacac.',emoji:'🌴'},
    {id:'turnos',label:'Turnos',emoji:'🔄'},{id:'nomina',label:'Nómina',emoji:'💵'},
    {id:'fallos',label:'Fallos',emoji:'⚠️'},{id:'ausencias',label:'Ausenc.',emoji:'🚫'},
    {id:'horas',label:'H.Extra',emoji:'⏱️'},
  ];

  const acept=()=>{ls('disclaimer-ok',true);setDisclaimerOk(true);};

  return <div style={{minHeight:'100svh',display:'flex',flexDirection:'column',background:'#f8fafc',fontFamily:'system-ui,-apple-system,sans-serif'}}>
    {!disclaimerOk&&<DisclaimerModal onAcepto={acept}/>}
    <div style={{background:'#1e293b',color:'white',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
      <span style={{fontSize:20}}>💼</span>
      <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15}}>Labora</div><div style={{fontSize:11,color:'#94a3b8'}}>Tu gestor laboral</div></div>
      {showY&&<div style={{position:'relative'}}><select value={year} onChange={e=>setYear(Number(e.target.value))} style={{appearance:'none',background:'#334155',color:'white',border:'none',borderRadius:8,padding:'6px 28px 6px 10px',fontWeight:600,fontSize:14,cursor:'pointer'}}>{ys.map(y=><option key={y} value={y}>{y}</option>)}</select><span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:10}}>▾</span></div>}
      {tab==='inicio'&&<div style={{display:'flex',gap:6,alignItems:'center'}}><DisclaimerInfo/><button onClick={()=>setTab('backup')} style={{background:'#334155',border:'none',borderRadius:8,padding:'6px 10px',color:'#94a3b8',cursor:'pointer',fontSize:16}}>💾</button></div>}
    </div>
    <div style={{flex:1,overflowY:'auto',padding:16,paddingBottom:90}}>
      {tab==='inicio'&&<InicioSection vacE={vacE} vacT={vacT} fallos={fallos} incid={incid} ausencias={aus} horas={horas} turnos={turnos} nominas={nominas} onNav={setTab}/>}
      {tab==='vacaciones'&&<VacSection entries={vacE} totales={vacT} year={year} onUpdateE={sVe} onUpdateT={sVt}/>}
      {tab==='cobro'&&<CobroSection/>}
      {tab==='turnos'&&<TurnosSection turnos={turnos} onUpdate={sT}/>}
      {tab==='nomina'&&<NominaSection nominas={nominas} onUpdate={sN}/>}
      {tab==='fallos'&&<FallosSection fallos={fallos} incid={incid} year={year} onUpdateF={sF} onUpdateI={sI}/>}
      {tab==='ausencias'&&<AusenciasSection items={aus} year={year} onUpdate={sA}/>}
      {tab==='horas'&&<HorasSection items={horas} year={year} onUpdate={sH}/>}
      {tab==='backup'&&<BackupSection/>}
    </div>
    <div style={{position:'fixed',bottom:0,left:0,right:0,background:'white',borderTop:'1px solid #e2e8f0',display:'grid',gridTemplateColumns:'repeat(7,1fr)',zIndex:99}}>
      {TABS.map(({id,label,emoji})=>{const act=tab===id;return <button key={id} onClick={()=>setTab(id)} style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'7px 2px',background:act?'#f8fafc':'white',border:'none',cursor:'pointer'}}><span style={{fontSize:18,lineHeight:1}}>{emoji}</span><span style={{fontSize:8,fontWeight:600,marginTop:2,color:act?'#1e293b':'#94a3b8',whiteSpace:'nowrap'}}>{label}</span></button>;})}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
