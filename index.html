<head>
  <meta charset="UTF-8"/>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;

const todayISO=()=>new Date().toISOString().split('T')[0];
const CY=new Date().getFullYear();
const CM=new Date().getMonth();
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_S=['L','M','X','J','V','S','D'];
const yearOf=iso=>parseInt(iso.slice(0,4),10);
const monthOf=iso=>parseInt(iso.slice(5,7),10)-1;
const fmt=iso=>new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const fmtLargo=iso=>{const d=new Date(iso+'T00:00:00');return d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear();};
const fmtISO=d=>d.toISOString().split('T')[0];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isWE=d=>{const dw=d.getDay();return dw===0||dw===6;};
const lsLoad=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const lsSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

function weeksAndDays(isoTarget){
  const now=new Date();now.setHours(0,0,0,0);
  const tgt=new Date(isoTarget+'T00:00:00');
  const diff=Math.ceil((tgt-now)/86400000);
  if(diff<=0)return null;
  return{weeks:Math.floor(diff/7),days:diff%7,total:diff};
}

function nextCobro(dia){
  const now=new Date();now.setHours(0,0,0,0);
  let y=now.getFullYear(),m=now.getMonth();
  let cobro=new Date(y,m,dia);
  if(cobro<=now){m++;if(m>11){m=0;y++;}cobro=new Date(y,m,dia);}
  const diff=Math.ceil((cobro-now)/86400000);
  return{date:cobro,weeks:Math.floor(diff/7),days:diff%7,total:diff};
}

function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),
    dy=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,dy);
}

function getFestivos(year,comunidad){
  const e=easter(year);
  const vs=new Date(e);vs.setDate(e.getDate()-2);
  const lp=new Date(e);lp.setDate(e.getDate()+1);
  const js=new Date(e);js.setDate(e.getDate()-3);
  const conLunes=['cataluna','c-valenciana','baleares','navarra','pais-vasco','la-rioja','murcia'];
  const f=[
    {d:new Date(year,0,1),n:'Ano Nuevo'},
    {d:new Date(year,0,6),n:'Reyes Magos'},
    {d:vs,n:'Viernes Santo'},
    {d:new Date(year,4,1),n:'Dia del Trabajo'},
    {d:new Date(year,9,12),n:'Fiesta Nacional'},
    {d:new Date(year,10,1),n:'Todos los Santos'},
    {d:new Date(year,11,6),n:'Dia de la Constitucion'},
    {d:new Date(year,11,8),n:'Inmaculada Concepcion'},
    {d:new Date(year,11,25),n:'Navidad'},
  ];
  if(conLunes.includes(comunidad))f.push({d:lp,n:'Lunes de Pascua'});
  else f.push({d:js,n:'Jueves Santo'});
  if(comunidad==='cataluna'){
    f.push({d:new Date(year,5,24),n:'Sant Joan'});
    f.push({d:new Date(year,8,11),n:'La Diada'});
    f.push({d:new Date(year,11,26),n:'Sant Esteve'});
  }
  return f.sort((a,b)=>a.d-b.d);
}

function isFest(d,festivos){return festivos.some(f=>fmtISO(f.d)===fmtISO(d));}

function calcFin(ini,dias,tipo,festivos){
  var cur=new Date(ini+'T00:00:00');
  var contados=0;
  var festUsados=0;
  while(true){
    var isF=isFest(cur,festivos);
    var isW=isWE(cur);
    if(tipo==='laborables'){
      if(!isF&&!isW) contados++;
      else if(isF) festUsados++;
    } else {
      if(!isF) contados++;
      else festUsados++;
    }
    if(contados>=dias) break;
    cur.setDate(cur.getDate()+1);
  }
  return{fin:fmtISO(cur),festUsados:festUsados};
}

function diasUsados(e,tipo,comunidad,hoy){
  var dias=Number(e.dias||0);
  if(dias===0)return 0;
  var ini=new Date(e.fecha+'T00:00:00');
  if(ini>hoy)return 0;
  var fests=getFestivos(yearOf(e.fecha),comunidad);
  var cur=new Date(ini);
  var contados=0;
  var usados=0;
  while(cur<=hoy&&contados<dias){
    var isF=isFest(cur,fests);
    var isW=isWE(cur);
    var cuenta=tipo==='laborables'?(!isF&&!isW):(!isF);
    if(cuenta){
      contados++;
      usados++;
    }
    cur.setDate(cur.getDate()+1);
  }
  return usados;
}

const ACCENT={
  red:'#dc2626',redL:'#fee2e2',
  blue:'#2563eb',blueL:'#dbeafe',
  emerald:'#059669',emeraldL:'#d1fae5',

function AddBtn({label,color,onClick}){

    <button onClick={onClick} style={{width:'100%',background:color,color:'white',border:'none',borderRadius:12,padding:'13px 0',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontWeight:600,fontSize:15,cursor:'pointer'}}>

function IconEdit(){return(<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>);}
function IconTrash(){return(<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>);}
function IconX({s=18}){return(<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);}
function IconChk(){return(<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>);}

function Item({item,onEdit,onDelete,children}){
  const [conf,setConf]=useState(false);
  return(
    <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:12,display:'flex',gap:8}}>
      <div style={{flex:1,minWidth:0}}>{children}</div>
      <div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
        {!conf?<>
          <button onClick={()=>onEdit(item)} style={{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}}><IconEdit/></button>
          <button onClick={()=>setConf(true)} style={{padding:8,background:'none',border:'none',borderRadius:8,cursor:'pointer',color:'#94a3b8'}}><IconTrash/></button>
        </>:<>
          <button onClick={()=>{onDelete(item.id);setConf(false);}} style={{padding:'6px 8px',background:'#dc2626',border:'none',borderRadius:8,cursor:'pointer',color:'white',fontWeight:800,fontSize:11}}>OK</button>
          <button onClick={()=>setConf(false)} style={{padding:6,background:'#f1f5f9',border:'none',borderRadius:8,cursor:'pointer',color:'#64748b'}}><IconX s={14}/></button>
        </>}
      </div>
    </div>
  );
}

function Empty({text}){
  return <div style={{background:'white',borderRadius:12,border:'2px dashed #cbd5e1',padding:32,textAlign:'center',color:'#94a3b8',fontSize:14}}>{text}</div>;
}

function Form({title,fields,initial,onSave,onCancel,color}){
  const [d,setD]=useState({...initial});
  const submit=()=>{
    for(const f of fields)if(f.req&&!String(d[f.name]||'').trim()){alert('Completa: '+f.label);return;}
    onSave(d);
  };
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  return(
    <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span style={{fontWeight:700,color:'#1e293b'}}>{title}</span>
        <button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button>
      </div>
      {fields.map(f=>(
        <div key={f.name}>
          <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>{f.label}{f.req&&<span style={{color:'#ef4444'}}> *</span>}</label>
          {f.type==='textarea'
            ?<textarea rows={3} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={{...inp,resize:'none'}}/>
            :<input type={f.type||'text'} step={f.step} min={f.min} value={d[f.name]||''} onChange={e=>setD({...d,[f.name]:e.target.value})} placeholder={f.ph||''} style={inp}/>
          }
        </div>
      ))}
      <div style={{display:'flex',gap:8,marginTop:4}}>
        <button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button>
        <button onClick={submit} style={{flex:1,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button>
      </div>
    </div>
  );
}

function FotoViewer({src,onClose}){
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <img src={src} style={{maxWidth:'100%',maxHeight:'90vh',borderRadius:8,objectFit:'contain'}}/>
      <button onClick={onClose} style={{position:'absolute',top:16,right:16,background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:36,height:36,color:'white',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>x</button>
    </div>
  );
}

function FotosPicker({fotos,onChange}){
  const [viewer,setViewer]=useState(null);
  const agregar=e=>{
    const files=Array.from(e.target.files).slice(0,3-fotos.length);
    files.forEach(f=>{
      const r=new FileReader();
      r.onload=ev=>onChange([...fotos,ev.target.result]);
      r.readAsDataURL(f);
    });
    e.target.value='';
  };
  const borrar=i=>onChange(fotos.filter((_,fi)=>fi!==i));
  return(
    <div>
      {viewer&&<FotoViewer src={viewer} onClose={()=>setViewer(null)}/>}
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}>
        {fotos.map((f,i)=>(
          <div key={i} style={{position:'relative'}}>
            <img src={f} onClick={()=>setViewer(f)} style={{width:72,height:72,borderRadius:8,objectFit:'cover',border:'1px solid #e2e8f0',cursor:'pointer'}}/>
            <button onClick={()=>borrar(i)} style={{position:'absolute',top:-6,right:-6,width:18,height:18,borderRadius:'50%',background:'#dc2626',border:'none',color:'white',fontSize:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>x</button>
          </div>
        ))}
        {fotos.length<3&&(
          <label style={{width:72,height:72,borderRadius:8,border:'2px dashed #cbd5e1',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:24,color:'#94a3b8',background:'#f8fafc'}}>
            +<input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={agregar}/>
          </label>
        )}
      </div>
    </div>
  );
}

function IncidForm({initial,onSave,onCancel,color}){
  const [d,setD]=useState({...initial});
  const [fotos,setFotos]=useState(initial.fotos||[]);
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const submit=()=>{
    if(!d.fecha){alert('Ingresa la fecha');return;}
    if(!String(d.titulo||'').trim()){alert('Ingresa el titulo');return;}
    if(!String(d.desc||'').trim()){alert('Ingresa la descripcion');return;}
    onSave({...d,fotos});
  };
  return(
    <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span style={{fontWeight:700,color:'#1e293b'}}>{initial.id?'Editar incidencia':'Nueva incidencia'}</span>
        <button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button>
      </div>
      <div>
        <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fecha *</label>
        <input type="date" value={d.fecha||''} onChange={e=>setD({...d,fecha:e.target.value})} style={inp}/>
      </div>
      <div>
        <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Titulo *</label>
        <input type="text" placeholder="Ej: Fallo de maquina" value={d.titulo||''} onChange={e=>setD({...d,titulo:e.target.value})} style={inp}/>
      </div>
      <div>
        <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Descripcion *</label>
        <textarea rows={3} placeholder="Detalla la incidencia..." value={d.desc||''} onChange={e=>setD({...d,desc:e.target.value})} style={{...inp,resize:'none'}}/>
      </div>
      <div>
        <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fotos (max. 3)</label>
        <FotosPicker fotos={fotos} onChange={setFotos}/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button>
        <button onClick={submit} style={{flex:2,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button>
      </div>
    </div>
  );
}

function IncidItem({it,onEdit,onDelete}){
  const [viewer,setViewer]=useState(null);
  return(
    <Item item={it} onEdit={onEdit} onDelete={onDelete}>
      {viewer&&<FotoViewer src={viewer} onClose={()=>setViewer(null)}/>}
      <div style={{fontSize:12,color:'#94a3b8'}}>{fmt(it.fecha)}</div>
      {it.titulo&&<div style={{fontSize:14,fontWeight:700,color:'#1e293b',marginTop:3}}>{it.titulo}</div>}
      <div style={{fontSize:13,color:'#475569',marginTop:3,wordBreak:'break-word'}}>{it.desc}</div>
      {it.fotos&&it.fotos.length>0&&(
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
          {it.fotos.map((f,fi)=>(
            <img key={fi} src={f} onClick={()=>setViewer(f)} style={{width:60,height:60,borderRadius:6,objectFit:'cover',border:'1px solid #e2e8f0',cursor:'pointer'}}/>
          ))}
        </div>
      )}
    </Item>
  );
}

function Calendario({entries,festivos,calYear,calMonth,onChMes,tipo,comunidad}){
  const vacDays=new Set();
  entries.forEach(e=>{
    if(!e.dias||Number(e.dias)<1)return;
    const fests=getFestivos(yearOf(e.fecha),comunidad);
    const r=calcFin(e.fecha,Number(e.dias),tipo,fests);
    let cur=new Date(e.fecha+'T00:00:00');
    const fin=new Date(r.fin+'T00:00:00');
    while(cur<=fin){vacDays.add(fmtISO(cur));cur.setDate(cur.getDate()+1);}
  });
  const todayStr=todayISO();
  const first=new Date(calYear,calMonth,1);
  const startDay=(first.getDay()+6)%7;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const festMes=festivos.filter(f=>f.d.getMonth()===calMonth&&f.d.getFullYear()===calYear);
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <span style={{fontWeight:700,fontSize:15,color:'#1e293b'}}>{MESES[calMonth]} {calYear}</span>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>onChMes(-1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8249;</button>
          <button onClick={()=>onChMes(1)} style={{width:30,height:30,borderRadius:'50%',border:'1px solid #e2e8f0',background:'white',cursor:'pointer',fontSize:16}}>&#8250;</button>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:8}}>
        {DIAS_S.map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:'#94a3b8',padding:'4px 0'}}>{d}</div>)}
        {Array(startDay).fill(null).map((_,i)=><div key={'e'+i}/>)}
        {Array(daysInMonth).fill(null).map((_,i)=>{
          const d=i+1;
          const date=new Date(calYear,calMonth,d);
          const ds=fmtISO(date);
          const isF=isFest(date,festivos);
          const isV=vacDays.has(ds);
          const isT=ds===todayStr;
          const isW=isWE(date);
          let bg='transparent',color=isW?'#94a3b8':'#1e293b',fw='normal';
          if(isT){bg='#1e293b';color='white';fw='700';}
          else if(isF){bg='#dbeafe';color='#2563eb';fw='700';}
          else if(isV){bg='#d1fae5';color='#065f46';}
          return(
            <div key={d} style={{textAlign:'center',padding:'5px 1px',borderRadius:6,fontSize:12,background:bg,color,fontWeight:fw,minHeight:28,display:'flex',alignItems:'center',justifyContent:'center'}}>{d}</div>
          );
        })}
      </div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#2563eb'}}/> Festivo</div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#059669'}}/> Vacaciones</div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#94a3b8'}}><div style={{width:8,height:8,borderRadius:'50%',background:'#1e293b'}}/> Hoy</div>
      </div>
      {festMes.length>0&&(
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {festMes.map((f,i)=>(
            <div key={i} style={{display:'flex',gap:10,background:'white',border:'1px solid #e2e8f0',borderRadius:8,padding:'8px 12px',alignItems:'center'}}>
              <span style={{fontSize:11,fontWeight:600,color:'#2563eb',minWidth:64}}>{f.d.getDate()} {MESES[f.d.getMonth()].slice(0,3)}</span>
              <span style={{fontSize:13,color:'#1e293b'}}>{f.n}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function VacForm({initial,tipo,festivos,onSave,onCancel,color}){
  const [fecha,setFecha]=useState(initial.fecha||'');
  const [dias,setDias]=useState(initial.dias?String(initial.dias):'');
  const [desc,setDesc]=useState(initial.desc||'');
  const [finCalc,setFinCalc]=useState('');
  const [festUsados,setFestUsados]=useState(0);
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};

  const calcular=(f,d)=>{
    if(!f||!d||parseInt(d)<1){setFinCalc('');return;}
    const r=calcFin(f,parseInt(d),tipo,festivos);
    setFinCalc(r.fin);
    setFestUsados(r.festUsados);
  };

  const submit=()=>{
    if(!fecha){alert('Ingresa la fecha de inicio');return;}
    if(!dias||parseInt(dias)<1){alert('Ingresa la cantidad de dias');return;}
    const r=calcFin(fecha,parseInt(dias),tipo,festivos);
    onSave({fecha,dias:parseInt(dias),fin:r.fin,desc});
  };

  return(
    <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span style={{fontWeight:700,color:'#1e293b'}}>Registrar vacaciones</span>
        <button onClick={onCancel} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button>
      </div>
      <div>
        <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fecha de inicio *</label>
        <input type="date" value={fecha} onChange={e=>{setFecha(e.target.value);calcular(e.target.value,dias);}} style={inp}/>
      </div>
      <div>
        <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Dias de vacaciones ({tipo}) *</label>
        <input type="number" min="1" step="1" placeholder="Ej: 5" value={dias} onChange={e=>{setDias(e.target.value);calcular(fecha,e.target.value);}} style={inp}/>
      </div>
      {finCalc&&(
        <div style={{background:'#f0fdf4',border:'1px solid #6ee7b7',borderRadius:8,padding:'10px 12px',fontSize:13,color:'#065f46'}}>
          Fin: <strong>{fmtLargo(finCalc)}</strong>
          {festUsados>0&&<div style={{fontSize:12,marginTop:4,color:'#059669'}}>{festUsados} festivo{festUsados>1?'s':''} no contado{festUsados>1?'s':''}</div>}
        </div>
      )}
      <div>
        <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Nota (opcional)</label>
        <textarea rows={2} placeholder="Ej: Vacaciones de verano" value={desc} onChange={e=>setDesc(e.target.value)} style={{...inp,resize:'none'}}/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={onCancel} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button>
        <button onClick={submit} style={{flex:2,padding:'11px 0',borderRadius:8,border:'none',background:color,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button>
      </div>
    </div>
  );
}

function VacSection({entries,totales,year,onUpdateE,onUpdateT}){
  const [form,setForm]=useState(false);
  const [ed,setEd]=useState(null);
  const [editT,setEditT]=useState(false);
  const [tInput,setTInput]=useState('');
  const [calYear,setCalYear]=useState(CY);
  const [calMonth,setCalMonth]=useState(CM);
  const [tipo,setTipo]=useState(()=>lsLoad('vac-tipo')||'laborables');
  const [comunidad,setComunidad]=useState(()=>lsLoad('vac-comunidad')||'cataluna');
  const festivos=getFestivos(year,comunidad);
  const festCal=getFestivos(calYear,comunidad);
  const chMes=dir=>{let m=calMonth+dir,y=calYear;if(m>11){m=0;y++;}if(m<0){m=11;y--;}setCalYear(y);setCalMonth(m);};
  const yKey=String(year);
  const totalD=Number(totales[yKey]??0);
  const ye=entries.filter(e=>yearOf(e.fecha)===year);
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const usados=ye.reduce((acc,e)=>acc+diasUsados(e,tipo,comunidad,hoy),0);
  const rest=totalD-usados;
  const pct=totalD>0?Math.min(100,(usados/totalD)*100):0;
  const now=new Date();now.setHours(0,0,0,0);
  const futuras=entries.filter(e=>new Date(e.fecha+'T00:00:00')>now).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const proximas=futuras[0]||null;
  const countdown=proximas?weeksAndDays(proximas.fecha):null;
  const abrirTotal=()=>{setTInput(String(totalD||''));setEditT(true);};
  const guardarTotal=()=>{const n=parseInt(tInput,10);if(isNaN(n)||n<0){alert('Ingresa un numero valido');return;}onUpdateT({...totales,[yKey]:n});setEditT(false);};
  const save=e=>{if(ed){onUpdateE(entries.map(i=>i.id===ed.id?{...e,id:ed.id}:i));setEd(null);}else{onUpdateE([{...e,id:uid()},...entries]);setForm(false);}};
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:20,fontWeight:700,boxSizing:'border-box',outline:'none'};

    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <SHead emoji="🌴" title="Vacaciones" sub={"Dias para "+year} bg={ACCENT.emeraldL}/>
      <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:14,display:'flex',flexDirection:'column',gap:10}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div><div style={{fontSize:13,fontWeight:600,color:'#1e293b'}}>Tipo de dias</div><div style={{fontSize:11,color:'#94a3b8'}}>Como cuenta tu convenio</div></div>
          <select value={tipo} onChange={e=>{setTipo(e.target.value);lsSave('vac-tipo',e.target.value);}} style={{fontSize:13,padding:'6px 8px',borderRadius:8,border:'1px solid #e2e8f0',background:'#f8fafc',color:'#1e293b'}}>
            <option value="laborables">Laborables</option>
            <option value="naturales">Naturales</option>
          </select>
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div><div style={{fontSize:13,fontWeight:600,color:'#1e293b'}}>Comunidad autonoma</div><div style={{fontSize:11,color:'#94a3b8'}}>Para calcular festivos</div></div>
          <select value={comunidad} onChange={e=>{setComunidad(e.target.value);lsSave('vac-comunidad',e.target.value);}} style={{fontSize:12,padding:'6px 8px',borderRadius:8,border:'1px solid #e2e8f0',background:'#f8fafc',color:'#1e293b',maxWidth:130}}>
            <option value="cataluna">Cataluna</option>
            <option value="c-valenciana">C. Valenciana</option>
            <option value="baleares">Baleares</option>
            <option value="navarra">Navarra</option>
            <option value="pais-vasco">Pais Vasco</option>
            <option value="la-rioja">La Rioja</option>
            <option value="murcia">Murcia</option>
            <option value="otras">Resto de Espana</option>
          </select>
        </div>
      </div>
      {countdown&&(
        <div style={{background:ACCENT.emeraldL,borderRadius:14,padding:16,border:'1px solid #6ee7b7'}}>
          <div style={{fontSize:11,color:ACCENT.emerald,fontWeight:700,marginBottom:4,textTransform:'uppercase'}}>Proximas vacaciones</div>
          <div style={{fontWeight:700,color:'#065f46',fontSize:14,marginBottom:8}}>{proximas.desc||fmtLargo(proximas.fecha)}</div>
          <div style={{display:'flex',alignItems:'baseline',gap:6,flexWrap:'wrap'}}>
            {countdown.weeks>0&&<><span style={{fontSize:40,fontWeight:900,color:ACCENT.emerald,lineHeight:1}}>{countdown.weeks}</span><span style={{fontSize:15,color:ACCENT.emerald,fontWeight:600}}>sem</span></>}
            {countdown.days>0&&<><span style={{fontSize:40,fontWeight:900,color:'#065f46',lineHeight:1,marginLeft:countdown.weeks>0?8:0}}>{countdown.days}</span><span style={{fontSize:15,color:'#065f46',fontWeight:600}}>dia{countdown.days!==1?'s':''}</span></>}
            {countdown.weeks===0&&countdown.days===0&&<span style={{fontSize:20,fontWeight:800,color:ACCENT.emerald}}>Empiezan hoy!</span>}

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:11,textTransform:'uppercase',color:'#94a3b8',fontWeight:700}}>Dias totales del ano</span>
          {!editT&&<button onClick={abrirTotal} style={{background:'none',border:'none',cursor:'pointer',color:ACCENT.emerald,fontWeight:600,fontSize:12,padding:4}}>{totalD>0?'Cambiar':'Definir'}</button>}
        </div>
        {editT?(
          <div style={{display:'flex',gap:8}}>
            <input type="number" min="0" step="1" value={tInput} autoFocus onChange={e=>setTInput(e.target.value)} style={inp}/>
            <button onClick={guardarTotal} style={{background:ACCENT.emerald,border:'none',borderRadius:8,padding:'0 12px',cursor:'pointer',color:'white',display:'flex',alignItems:'center'}}><IconChk/></button>
            <button onClick={()=>setEditT(false)} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'0 10px',cursor:'pointer',color:'#64748b',display:'flex',alignItems:'center'}}><IconX/></button>
          </div>
        ):(
          <span style={{fontSize:30,fontWeight:800,color:'#1e293b'}}>{totalD} <span style={{fontSize:14,fontWeight:400,color:'#94a3b8'}}>dias asignados</span></span>
        )}
      </div>
      <div style={{display:'flex',gap:10}}>
        <Stat label="Usados" value={usados} unit="dias" color={ACCENT.amber}/>
        <Stat label="Disponibles" value={rest} unit="dias" color={rest<0?ACCENT.red:ACCENT.emerald}/>
      </div>
      {totalD>0&&(
        <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:12}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#94a3b8',marginBottom:6}}><span>Progreso</span><span>{usados} / {totalD} dias</span></div>
          <div style={{height:10,background:'#f1f5f9',borderRadius:99,overflow:'hidden'}}>
            <div style={{height:'100%',width:pct+'%',background:ACCENT.emerald,borderRadius:99,transition:'width 0.3s'}}/>
          </div>
        </div>
      )}
      <AddBtn label="Registrar vacaciones" color={ACCENT.emerald} onClick={()=>{setEd(null);setForm(true);}}/>
      {(form||ed)&&<VacForm initial={ed||{fecha:todayISO(),dias:'',desc:''}} tipo={tipo} festivos={festivos} onSave={save} onCancel={()=>{setForm(false);setEd(null);}} color={ACCENT.emerald}/>}
      <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:14}}>

      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {ye.length===0&&<Empty text="Sin vacaciones registradas este ano"/>}
        {[...ye].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(it=>{
          const wd=weeksAndDays(it.fecha);
          return(
            <Item key={it.id} item={it} onEdit={i=>{setEd(i);setForm(false);}} onDelete={id=>onUpdateE(entries.filter(i=>i.id!==id))}>
              <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:8}}>
                <span style={{fontSize:12,color:'#94a3b8'}}>{fmtLargo(it.fecha)}{it.fin&&it.fin!==it.fecha?' — '+fmtLargo(it.fin):''}</span>
                <span style={{fontSize:18,fontWeight:800,color:ACCENT.emerald,flexShrink:0}}>{it.dias} {it.dias===1?'dia':'dias'}</span>
              </div>
              {it.desc&&<div style={{fontSize:13,color:'#475569',marginTop:3}}>{it.desc}</div>}
              {wd&&<div style={{fontSize:12,color:ACCENT.emerald,marginTop:4,fontWeight:600}}>Faltan {wd.weeks>0?wd.weeks+' sem':''}{wd.weeks>0&&wd.days>0?' y ':''}{wd.days>0?wd.days+' dia'+(wd.days!==1?'s':''):''}</div>}
              {!wd&&<div style={{fontSize:12,color:'#94a3b8',marginTop:4}}>Ya pasaron</div>}
            </Item>
          );
        })}
      </div>
    </div>
  );
}

function AusenciasSection({items,year,onUpdate}){
  const [form,setForm]=useState(false);
  const [ed,setEd]=useState(null);
  const [fecha,setFecha]=useState(todayISO());
  const [just,setJust]=useState('');
  const [motivo,setMotivo]=useState('');
  const [horas,setHoras]=useState('');
  const [estado,setEstado]=useState('Pendiente');
  const yi=items.filter(i=>yearOf(i.fecha)===year);
  const mi=yi.filter(i=>monthOf(i.fecha)===CM&&year===CY);
  const hPendMes=mi.filter(i=>i.estado==='Pendiente').reduce((s,i)=>s+Number(i.horas||0),0);
  const hPendAnio=yi.filter(i=>i.estado==='Pendiente').reduce((s,i)=>s+Number(i.horas||0),0);
  const reset=()=>{setFecha(todayISO());setJust('');setMotivo('');setHoras('');setEstado('Pendiente');};
  const abrir=()=>{reset();setEd(null);setForm(true);};
  const abrirEd=it=>{setFecha(it.fecha);setJust(it.just);setMotivo(it.motivo||'');setHoras(String(it.horas||''));setEstado(it.estado||'Pendiente');setEd(it);setForm(true);};
  const guardar=()=>{
    if(!fecha){alert('Ingresa la fecha');return;}
    if(!just){alert('Indica si es justificada o no');return;}
    const item={fecha,just,motivo,horas:parseFloat(horas)||0,estado};
    if(ed){onUpdate(items.map(i=>i.id===ed.id?{...item,id:ed.id}:i));setEd(null);}
    else{onUpdate([{...item,id:uid()},...items]);}
    setForm(false);reset();
  };
  const inp={width:'100%',padding:'10px 12px',border:'1px solid #cbd5e1',borderRadius:8,fontSize:16,boxSizing:'border-box',outline:'none'};
  const Rbtn=({val,cur,onSel,col})=>(
    <button onClick={()=>onSel(val)} style={{padding:'8px 14px',borderRadius:20,border:'1px solid '+(cur===val?(col||ACCENT.blue):'#e2e8f0'),background:cur===val?(col||ACCENT.blue):'white',color:cur===val?'white':'#475569',fontSize:13,fontWeight:600,cursor:'pointer'}}>{val}</button>
  );
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <SHead emoji="🚫" title="Ausencias" sub="Dias no trabajados" bg={ACCENT.redL}/>
      <div style={{display:'flex',gap:10}}>
        <Stat label={MESES[CM]} value={mi.length} unit="este mes" color={ACCENT.red}/>
        <Stat label={"Ano "+year} value={yi.length} unit="en total" color={ACCENT.red}/>
      </div>
      {(hPendMes>0||hPendAnio>0)&&(
        <div style={{display:'flex',gap:10}}>
          <Stat label="Horas pend. mes" value={hPendMes+'h'} unit="pendientes" color={ACCENT.amber}/>
          <Stat label="Horas pend. ano" value={hPendAnio+'h'} unit="pendientes" color={ACCENT.amber}/>
        </div>
      )}
      <AddBtn label="Registrar ausencia" color={ACCENT.red} onClick={abrir}/>
      {form&&(
        <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontWeight:700,color:'#1e293b'}}>{ed?'Editar ausencia':'Nueva ausencia'}</span>
            <button onClick={()=>{setForm(false);setEd(null);}} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:4}}><IconX/></button>
          </div>
          <div>
            <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Fecha *</label>
            <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} style={inp}/>
          </div>
          <div>
            <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:6}}>Justificada? *</label>
            <div style={{display:'flex',gap:8}}>
              <Rbtn val="Justificada" cur={just} onSel={setJust} col={ACCENT.emerald}/>
              <Rbtn val="Injustificada" cur={just} onSel={setJust} col={ACCENT.red}/>
            </div>
          </div>
          <div>
            <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Motivo</label>
            <textarea rows={2} placeholder="Ej: Cita medica, enfermedad..." value={motivo} onChange={e=>setMotivo(e.target.value)} style={{...inp,resize:'none'}}/>
          </div>
          <div>
            <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:4}}>Horas faltantes (0 si fue dia completo)</label>
            <input type="number" min="0" max="12" step="0.5" placeholder="0" value={horas} onChange={e=>setHoras(e.target.value)} style={inp}/>
          </div>
          <div>
            <label style={{display:'block',fontSize:12,fontWeight:600,color:'#64748b',marginBottom:6}}>Estado</label>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <Rbtn val="Pendiente" cur={estado} onSel={setEstado} col={ACCENT.amber}/>
              <Rbtn val="Devueltas" cur={estado} onSel={setEstado} col={ACCENT.emerald}/>
              <Rbtn val="Descontadas" cur={estado} onSel={setEstado} col='#475569'/>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>{setForm(false);setEd(null);}} style={{flex:1,padding:'11px 0',borderRadius:8,border:'1px solid #cbd5e1',background:'white',color:'#475569',fontWeight:600,cursor:'pointer'}}>Cancelar</button>
            <button onClick={guardar} style={{flex:2,padding:'11px 0',borderRadius:8,border:'none',background:ACCENT.red,color:'white',fontWeight:600,cursor:'pointer'}}>Guardar</button>
          </div>
        </div>
      )}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {yi.length===0&&<Empty text="Sin ausencias registradas este ano"/>}
        {[...yi].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(it=>{
          const inj=it.just==='Injustificada';
          const estColor=it.estado==='Devueltas'?ACCENT.emerald:it.estado==='Descontadas'?'#475569':ACCENT.amber;
          return(
            <Item key={it.id} item={it} onEdit={abrirEd} onDelete={id=>onUpdate(items.filter(i=>i.id!==id))}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:4}}>
                <span style={{fontSize:12,color:'#94a3b8'}}>{fmt(it.fecha)}</span>
                <span style={{fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:20,background:inj?ACCENT.redL:ACCENT.emeraldL,color:inj?ACCENT.red:ACCENT.emerald}}>{it.just}</span>
              </div>
              {it.motivo&&<div style={{fontSize:13,color:'#475569',marginBottom:4,wordBreak:'break-word'}}>{it.motivo}</div>}
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {it.horas>0&&<span style={{fontSize:11,fontWeight:600,padding:'2px 8px',borderRadius:20,background:ACCENT.amberL,color:ACCENT.amber}}>{it.horas}h faltantes</span>}
                <span style={{fontSize:11,fontWeight:600,padding:'2px 8px',borderRadius:20,background:'#f1f5f9',color:estColor}}>{it.estado}</span>
              </div>
            </Item>
          );
        })}
      </div>
    </div>
  );
}

function HorasSection({items,year,onUpdate}){
  const [form,setForm]=useState(false);
  const [ed,setEd]=useState(null);
  const yi=items.filter(i=>yearOf(i.fecha)===year);
  const mi=yi.filter(i=>monthOf(i.fecha)===CM&&year===CY);
  const sum=a=>a.reduce((s,i)=>s+Number(i.horas||0),0);
  const F=[{name:'fecha',label:'Fecha',type:'date',req:true},{name:'horas',label:'Horas',type:'number',step:'0.5',min:'0',req:true,ph:'Ej: 2.5'},{name:'desc',label:'Nota (opcional)',type:'textarea',ph:'Motivo...'}];
  const save=e=>{const c={...e,horas:Number(e.horas)||0};if(ed){onUpdate(items.map(i=>i.id===ed.id?{...c,id:ed.id}:i));setEd(null);}else{onUpdate([{...c,id:uid()},...items]);setForm(false);}};
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <SHead emoji="⏱️" title="Horas extras" sub="Horas fuera de horario" bg={ACCENT.blueL}/>
      <div style={{display:'flex',gap:10}}>
        <Stat label={MESES[CM]} value={sum(mi)} unit="horas este mes" color={ACCENT.blue}/>
        <Stat label={"Ano "+year} value={sum(yi)} unit="horas en total" color={ACCENT.blue}/>
      </div>
      <AddBtn label="Anadir horas extras" color={ACCENT.blue} onClick={()=>{setEd(null);setForm(true);}}/>
      {(form||ed)&&<Form title={ed?'Editar horas':'Nuevas horas extras'} fields={F} initial={ed||{fecha:todayISO(),horas:'',desc:''}} onSave={save} onCancel={()=>{setForm(false);setEd(null);}} color={ACCENT.blue}/>}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {yi.length===0&&<Empty text="Sin horas extras este ano"/>}
        {[...yi].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(it=>(
          <Item key={it.id} item={it} onEdit={setEd} onDelete={id=>onUpdate(items.filter(i=>i.id!==id))}>
            <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:8}}>
              <span style={{fontSize:12,color:'#94a3b8'}}>{fmt(it.fecha)}</span>
              <span style={{fontSize:20,fontWeight:800,color:ACCENT.blue}}>{it.horas} h</span>
            </div>
            {it.desc&&<div style={{fontSize:13,color:'#475569',marginTop:3,wordBreak:'break-word'}}>{it.desc}</div>}
          </Item>
        ))}
      </div>
    </div>
  );
}

function BackupSection(){
  const [msg,setMsg]=useState('');
  const exportar=()=>{
    const data={
      version:1,
      fecha:new Date().toISOString(),
      fallos:lsLoad('fallos')||[],
      horas:lsLoad('horas')||[],
      vacE:lsLoad('vac-e')||[],
      vacT:lsLoad('vac-t')||{},
      incid:lsLoad('incid')||[],
      ausencias:lsLoad('ausencias')||[],
      cobroDia:lsLoad('cobro-dia')||28,
      vacTipo:lsLoad('vac-tipo')||'laborables',
      vacComunidad:lsLoad('vac-comunidad')||'cataluna',
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='labora-backup-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(url);
    setMsg('Copia de seguridad descargada correctamente');
    setTimeout(()=>setMsg(''),4000);
  };
  const importar=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.version){alert('Archivo no valido');return;}
        if(Array.isArray(data.fallos))lsSave('fallos',data.fallos);
        if(Array.isArray(data.horas))lsSave('horas',data.horas);
        if(Array.isArray(data.vacE))lsSave('vac-e',data.vacE);
        if(data.vacT)lsSave('vac-t',data.vacT);
        if(Array.isArray(data.incid))lsSave('incid',data.incid);
        if(Array.isArray(data.ausencias))lsSave('ausencias',data.ausencias);
        if(data.cobroDia)lsSave('cobro-dia',data.cobroDia);
        if(data.vacTipo)lsSave('vac-tipo',data.vacTipo);
        if(data.vacComunidad)lsSave('vac-comunidad',data.vacComunidad);
        setMsg('Datos restaurados. Recarga la app para verlos.');
      }catch{alert('Error al leer el archivo.');}
    };
    r.readAsText(file);
    e.target.value='';
  };
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <SHead emoji="💾" title="Copia de seguridad" sub="Exporta e importa tus datos" bg="#f0fdf4"/>
      <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:10}}>
        <div style={{fontSize:13,fontWeight:600,color:'#1e293b'}}>Exportar datos</div>
        <div style={{fontSize:12,color:'#64748b'}}>Descarga un archivo con todos tus datos. Guardalo en un lugar seguro para restaurarlos si cambias de movil o reinstalan la app.</div>
        <button onClick={exportar} style={{width:'100%',background:ACCENT.emerald,color:'white',border:'none',borderRadius:10,padding:'13px 0',fontWeight:600,fontSize:15,cursor:'pointer'}}>Descargar copia de seguridad</button>
      </div>
      <div style={{background:'white',borderRadius:12,border:'1px solid #e2e8f0',padding:16,display:'flex',flexDirection:'column',gap:10}}>
        <div style={{fontSize:13,fontWeight:600,color:'#1e293b'}}>Restaurar datos</div>
        <div style={{fontSize:12,color:'#64748b'}}>Selecciona un archivo de backup de Labora. Los datos actuales seran reemplazados.</div>
        <label style={{width:'100%',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'13px 0',fontWeight:600,fontSize:15,cursor:'pointer',textAlign:'center',color:ACCENT.blue,display:'block'}}>
          Seleccionar archivo de backup
          <input type="file" accept=".json" style={{display:'none'}} onChange={importar}/>
        </label>
      </div>
      {msg&&<div style={{background:'#f0fdf4',border:'1px solid #6ee7b7',borderRadius:10,padding:'12px 14px',fontSize:13,color:'#065f46',fontWeight:600}}>{msg}</div>}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState('vacaciones');
  const [year,setYear]=useState(CY);
  const [fallos,setFallos]=useState([]);
  const [horas,setHoras]=useState([]);
  const [vacE,setVacE]=useState([]);
  const [vacT,setVacT]=useState({});
  const [incid,setIncid]=useState([]);
  const [ausencias,setAusencias]=useState([]);

  useEffect(()=>{
    const f=lsLoad('fallos');if(Array.isArray(f))setFallos(f);
    const h=lsLoad('horas');if(Array.isArray(h))setHoras(h);
    const vt=lsLoad('vac-t');if(vt&&typeof vt==='object')setVacT(vt);
    const i=lsLoad('incid');if(Array.isArray(i))setIncid(i);
    const a=lsLoad('ausencias');if(Array.isArray(a))setAusencias(a);
    const ve=lsLoad('vac-e');
    if(Array.isArray(ve)){
      const tipo=lsLoad('vac-tipo')||'laborables';
      const comunidad=lsLoad('vac-comunidad')||'cataluna';
      const corregidas=ve.map(e=>{
        if(!e.dias||Number(e.dias)<1)return e;
        const fests=getFestivos(yearOf(e.fecha),comunidad);
        const finCorrecto=calcFin(e.fecha,Number(e.dias),tipo,fests).fin;
        if(e.fin===finCorrecto)return e;
        return{...e,fin:finCorrecto};
      });
      const hayDiferencias=corregidas.some((e,i)=>e.fin!==ve[i].fin);
      if(hayDiferencias)lsSave('vac-e',corregidas);
      setVacE(corregidas);
    }
  },[]);

  const sf=d=>{setFallos(d);lsSave('fallos',d);};
  const sh=d=>{setHoras(d);lsSave('horas',d);};
  const sve=d=>{setVacE(d);lsSave('vac-e',d);};
  const svt=d=>{setVacT(d);lsSave('vac-t',d);};
  const si=d=>{setIncid(d);lsSave('incid',d);};
  const sa=d=>{setAusencias(d);lsSave('ausencias',d);};

  const ys=[];for(let y=CY+1;y>=CY-4;y--)ys.push(y);
  const showYear=tab!=='cobro'&&tab!=='backup';

  const TABS=[
    {id:'vacaciones',label:'Vacaciones',emoji:'🌴'},
    {id:'cobro',label:'Cobro',emoji:'💰'},
    {id:'fallos',label:'Fallos',emoji:'⚠️'},
    {id:'ausencias',label:'Ausencias',emoji:'🚫'},
    {id:'horas',label:'H.Extras',emoji:'⏱️'},
    {id:'backup',label:'Backup',emoji:'💾'},
  ];

  return(
    <div style={{minHeight:'100svh',display:'flex',flexDirection:'column',background:'#f8fafc',fontFamily:'system-ui,-apple-system,sans-serif'}}>
      <div style={{background:'#1e293b',color:'white',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <span style={{fontSize:20}}>💼</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:15}}>Labora</div>
          <div style={{fontSize:11,color:'#94a3b8'}}>Tu gestor laboral</div>
        </div>
        {showYear&&(
          <div style={{position:'relative'}}>
            <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{appearance:'none',background:'#334155',color:'white',border:'none',borderRadius:8,padding:'6px 28px 6px 10px',fontWeight:600,fontSize:14,cursor:'pointer'}}>
              {ys.map(y=><option key={y} value={y}>{y}</option>)}
            </select>
            <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:10}}>▾</span>
          </div>
        )}
      </div>
      <div style={{flex:1,overflowY:'auto',padding:16,paddingBottom:80}}>
        {tab==='vacaciones'&&<VacSection entries={vacE} totales={vacT} year={year} onUpdateE={sve} onUpdateT={svt}/>}
        {tab==='cobro'&&<CobroSection/>}
        {tab==='fallos'&&<FallosSection fallos={fallos} incid={incid} year={year} onUpdateF={sf} onUpdateI={si}/>}
        {tab==='ausencias'&&<AusenciasSection items={ausencias} year={year} onUpdate={sa}/>}
        {tab==='horas'&&<HorasSection items={horas} year={year} onUpdate={sh}/>}
        {tab==='backup'&&<BackupSection/>}
      </div>
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'white',borderTop:'1px solid #e2e8f0',display:'grid',gridTemplateColumns:'repeat(6,1fr)',zIndex:99}}>
        {TABS.map(({id,label,emoji})=>{
          const active=tab===id;
          return(
            <button key={id} onClick={()=>setTab(id)} style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'7px 2px',background:active?'#f8fafc':'white',border:'none',cursor:'pointer'}}>
              <span style={{fontSize:19,lineHeight:1}}>{emoji}</span>
              <span style={{fontSize:9,fontWeight:600,marginTop:2,color:active?'#1e293b':'#94a3b8',whiteSpace:'nowrap'}}>{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
